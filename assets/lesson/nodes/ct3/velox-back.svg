<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" font-family="Archivo, Helvetica, Arial, sans-serif" class="velox-advert" viewBox="0 0 400 250" role="img" aria-label="Velox 14 specification sheet. Processor: Velox V5, 4 cores. Clock speed: 2.6 GHz base, up to 5.2 GHz Turbo (one core). Cache: 8 MB L3. Memory (RAM): 8 GB. Storage: 256 GB SSD. Display: 14-inch, 1920 × 1080. Graphics: Integrated. Cooling: Single fan, 15 mm thin case. Battery: Up to 10 hours*. Battery life measured during local video playback."><rect width="400" height="250" rx="10" fill="#F4F1EA"></rect><rect width="400" height="40" rx="10" fill="#10162B"></rect><rect y="30" width="400" height="10" fill="#10162B"></rect><text x="20" y="25" fill="#C9D1E8" font-size="12" font-weight="700" letter-spacing="2">VELOX 14</text><text x="380" y="25" text-anchor="end" fill="#FFB347" font-size="11" font-weight="700">Technical specifications</text><g><text x="20" y="62" fill="#566074" font-size="10.5" font-weight="600">Processor</text><text x="120" y="62" fill="#182033" font-size="10.5">Velox V5, 4 cores</text></g><g><line x1="20" y1="67.5" x2="380" y2="67.5" stroke="#D9D3C5" stroke-width="1"></line><text x="20" y="80.5" fill="#566074" font-size="10.5" font-weight="600">Clock speed</text><text x="120" y="80.5" fill="#182033" font-size="10.5">2.6 GHz base, up to 5.2 GHz Turbo (one core)</text></g><g><line x1="20" y1="86" x2="380" y2="86" stroke="#D9D3C5" stroke-width="1"></line><text x="20" y="99" fill="#566074" font-size="10.5" font-weight="600">Cache</text><text x="120" y="99" fill="#182033" font-size="10.5">8 MB L3</text></g><g><line x1="20" y1="104.5" x2="380" y2="104.5" stroke="#D9D3C5" stroke-width="1"></line><text x="20" y="117.5" fill="#566074" font-size="10.5" font-weight="600">Memory (RAM)</text><text x="120" y="117.5" fill="#182033" font-size="10.5">8 GB</text></g><g><line x1="20" y1="123" x2="380" y2="123" stroke="#D9D3C5" stroke-width="1"></line><text x="20" y="136" fill="#566074" font-size="10.5" font-weight="600">Storage</text><text x="120" y="136" fill="#182033" font-size="10.5">256 GB SSD</text></g><g><line x1="20" y1="141.5" x2="380" y2="141.5" stroke="#D9D3C5" stroke-width="1"></line><text x="20" y="154.5" fill="#566074" font-size="10.5" font-weight="600">Display</text><text x="120" y="154.5" fill="#182033" font-size="10.5">14-inch, 1920 × 1080</text></g><g><line x1="20" y1="160" x2="380" y2="160" stroke="#D9D3C5" stroke-width="1"></line><text x="20" y="173" fill="#566074" font-size="10.5" font-weight="600">Graphics</text><text x="120" y="173" fill="#182033" font-size="10.5">Integrated</text></g><g><line x1="20" y1="178.5" x2="380" y2="178.5" stroke="#D9D3C5" stroke-width="1"></line><text x="20" y="191.5" fill="#566074" font-size="10.5" font-weight="600">Cooling</text><text x="120" y="191.5" fill="#182033" font-size="10.5">Single fan, 15 mm thin case</text></g><g><line x1="20" y1="197" x2="380" y2="197" stroke="#D9D3C5" stroke-width="1"></line><text x="20" y="210" fill="#566074" font-size="10.5" font-weight="600">Battery</text><text x="120" y="210" fill="#182033" font-size="10.5">Up to 10 hours*</text></g><text x="20" y="236" fill="#8A8574" font-size="8.5">*Measured during local video playback. Performance varies by workload.</text></svg>