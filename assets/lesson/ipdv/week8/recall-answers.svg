<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
<rect width="1280" height="720" fill="#fbfaf8"/>
<text x="64" y="58" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="2.6" fill="#c8102e">RECALL FIRST</text>
<text x="64" y="100" font-family="'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif" font-size="36" fill="#14181f">Last week, the answers</text>
<circle cx="104" cy="215" r="32" fill="#eef1f5"/>
<g transform="translate(104 215) scale(1.000)"><path d="M0 18 C-10 4 -14 -2 -14 -6 a14 14 0 0 1 28 0 c0 4 -4 10 -14 24 z" fill="none" stroke="#0c3354" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><circle cy="-6" r="5" fill="#c8102e"/></g>
<text x="160" y="224.0" font-family="'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif" font-size="26" fill="#14181f">When is a map the right picture?</text>
<text x="640" y="193.2" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-size="23" fill="#14181f">When where a thing is helps the reader. Where a</text>
<text x="640" y="223.1" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-size="23" fill="#14181f">dot sits is the strongest clue we have, so a map</text>
<text x="640" y="253.0" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-size="23" fill="#14181f">spends it on place.</text>
<line x1="64" y1="290" x2="1216" y2="290" stroke="#d9d4ca" stroke-width="1.5"/>
<circle cx="104" cy="365" r="32" fill="#eef1f5"/>
<g transform="translate(104 365) scale(1.000)"><circle r="17" fill="none" stroke="#0c3354" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><ellipse rx="7" ry="17" fill="none" stroke="#0c3354" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M-17 0 h34" fill="none" stroke="#0c3354" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="160" y="359.0" font-family="'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif" font-size="26" fill="#14181f">Why does every flat map lie a</text>
<text x="160" y="389.0" font-family="'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif" font-size="26" fill="#14181f">little?</text>
<text x="640" y="343.2" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-size="23" fill="#14181f">The Earth is round. Flattening it stretches</text>
<text x="640" y="373.1" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-size="23" fill="#14181f">sizes, shapes or distances: you choose what to</text>
<text x="640" y="403.0" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-size="23" fill="#14181f">keep true.</text>
<line x1="64" y1="440" x2="1216" y2="440" stroke="#d9d4ca" stroke-width="1.5"/>
<circle cx="104" cy="515" r="32" fill="#eef1f5"/>
<g transform="translate(104 515) scale(1.000)"><rect x="-18" y="-16" width="10" height="10" fill="#c6dbef"/><rect x="-5" y="-16" width="10" height="10" fill="#6baed6"/><rect x="8" y="-16" width="10" height="10" fill="#2171b5"/><path d="M-16 8 h32 M-16 15 h22" fill="none" stroke="#0c3354" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="160" y="509.0" font-family="'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif" font-size="26" fill="#14181f">Why colour a map by rate, not by</text>
<text x="160" y="539.0" font-family="'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif" font-size="26" fill="#14181f">count?</text>
<text x="640" y="508.1" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-size="23" fill="#14181f">Big places have more of everything. A rate (per</text>
<text x="640" y="538.0" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-size="23" fill="#14181f">1,000 people) makes places fair to compare.</text>
</svg>