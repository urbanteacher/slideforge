<text x="1034" y="308" text-anchor="middle" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="1.5" fill="#c8102e">YOU ARE HERE</text>
<text x="64" y="580" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-size="22" fill="#5a6572">Weeks 1–7 drew tables: one row per thing. Today the data is the connections between things.</text>
<text x="64" y="614" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-size="22" fill="#5a6572">The final page can carry a network or a tree as one of its panels.</text>
