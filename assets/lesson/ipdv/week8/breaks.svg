<text x="84" y="563" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-size="18" fill="#14181f">Past a few hundred, the</text>
<text x="84" y="588" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-size="18" fill="#14181f">middle is a tangle: a</text>
