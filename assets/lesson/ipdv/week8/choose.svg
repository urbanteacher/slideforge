<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
<rect width="1280" height="720" fill="#fbfaf8"/>
<text x="64" y="58" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="2.6" fill="#c8102e">CHOOSE</text>
<text x="64" y="100" font-family="'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif" font-size="36" fill="#14181f">Which drawing? Ask what the reader wants to know</text>
<circle cx="104" cy="215" r="32" fill="#eef1f5"/>
<g transform="translate(104 215) scale(1.000)"><path d="M-16 12 L-4 -4 L8 4 L18 -14" fill="none" stroke="#0c3354" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="-16" cy="12" r="4" fill="#c8102e"/><circle cx="18" cy="-14" r="4" fill="#c8102e"/></g>
<text x="160" y="224.0" font-family="'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif" font-size="26" fill="#14181f">“How do I get from A to B?”</text>
<rect x="560" y="196" width="223" height="38" rx="19" fill="#0c3354" stroke="#0c3354" stroke-width="2" />
<text x="671.5" y="221" text-anchor="middle" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="1.2" fill="#fff">DOTS AND LINES</text>
<text x="800" y="222.7" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-size="22" fill="#14181f">Trace the route with your finger.</text>
<line x1="64" y1="290" x2="1216" y2="290" stroke="#d9d4ca" stroke-width="1.5"/>
<circle cx="104" cy="365" r="32" fill="#eef1f5"/>
<g transform="translate(104 365) scale(1.000)"><rect x="-17" y="-17" width="10" height="10" fill="#c9d3dd"/><rect x="-5" y="-17" width="10" height="10" fill="#c9d3dd"/><rect x="7" y="-17" width="10" height="10" fill="#c9d3dd"/><rect x="-17" y="-5" width="10" height="10" fill="#c9d3dd"/><rect x="-5" y="-5" width="10" height="10" fill="#c9d3dd"/><rect x="7" y="-5" width="10" height="10" fill="#c8102e"/><rect x="-17" y="7" width="10" height="10" fill="#c9d3dd"/><rect x="-5" y="7" width="10" height="10" fill="#c9d3dd"/><rect x="7" y="7" width="10" height="10" fill="#c9d3dd"/></g>
<text x="160" y="374.0" font-family="'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif" font-size="26" fill="#14181f">“Are these two connected?”</text>
<rect x="560" y="346" width="223" height="38" rx="19" fill="#0c3354" stroke="#0c3354" stroke-width="2" />
<text x="671.5" y="371" text-anchor="middle" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="1.2" fill="#fff">A GRID</text>
<text x="800" y="358.4" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-size="22" fill="#14181f">With lots of lines, look up one</text>
<text x="800" y="387.0" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-size="22" fill="#14181f">square.</text>
<line x1="64" y1="440" x2="1216" y2="440" stroke="#d9d4ca" stroke-width="1.5"/>
<circle cx="104" cy="515" r="32" fill="#eef1f5"/>
<g transform="translate(104 515) scale(1.000)"><rect x="-20" y="-18" width="22" height="36" fill="#4c78a8"/><rect x="4" y="-18" width="16" height="20" fill="#f58518"/><rect x="4" y="4" width="16" height="14" fill="#f58518" opacity=".6"/></g>
<text x="160" y="509.0" font-family="'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif" font-size="26" fill="#14181f">“What’s biggest, and what</text>
<text x="160" y="539.0" font-family="'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif" font-size="26" fill="#14181f">does it belong to?”</text>
<rect x="560" y="496" width="223" height="38" rx="19" fill="#0c3354" stroke="#0c3354" stroke-width="2" />
<text x="671.5" y="521" text-anchor="middle" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="1.2" fill="#fff">BOXES INSIDE BOXES</text>
<text x="800" y="522.7" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-size="22" fill="#14181f">The biggest box, inside its group.</text>
</svg>