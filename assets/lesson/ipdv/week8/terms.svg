<text x="810" y="604" text-anchor="middle" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="700" fill="#14181f">Tower H.</text>
<circle cx="890" cy="566" r="16" fill="#fff" stroke="#0c3354" stroke-width="3"/>
<text x="890" y="604" text-anchor="middle" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="700" fill="#14181f">Islington</text>
<text x="1240" y="182" text-anchor="end" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-size="15" fill="#5a6572">Level 0</text>
<text x="1240" y="312" text-anchor="end" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-size="15" fill="#5a6572">Level 1</text>
<text x="1240" y="442" text-anchor="end" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-size="15" fill="#5a6572">Level 2</text>
<text x="1240" y="572" text-anchor="end" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-size="15" fill="#5a6572">Level 3</text>
<text x="64" y="168" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-size="21" font-weight="700" fill="#c8102e">Root</text>
<text x="64" y="194" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-size="17" fill="#14181f">The one node with no parent: London.</text>
<text x="64" y="294" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-size="21" font-weight="700" fill="#c8102e">Parent and children</text>
<text x="64" y="320" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-size="17" fill="#14181f">Inner and Outer are London’s children;</text>
<text x="64" y="342" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-size="17" fill="#14181f">London is their parent.</text>
<text x="64" y="412" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-size="21" font-weight="700" fill="#c8102e">Siblings</text>
<text x="64" y="438" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-size="17" fill="#14181f">Nodes with the same parent, like West and</text>
<text x="64" y="460" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-size="17" fill="#14181f">East.</text>
<text x="64" y="520" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-size="21" font-weight="700" fill="#c8102e">Subtree (the pink box)</text>
<text x="64" y="546" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-size="17" fill="#14181f">A node and everything below it.</text>
<text x="64" y="616" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-size="21" font-weight="700" fill="#c8102e">Leaves</text>
<text x="64" y="642" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-size="17" fill="#14181f">Nodes with no children: the boroughs,</text>
<text x="64" y="664" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-size="17" fill="#14181f">South and NE.</text>
</svg>