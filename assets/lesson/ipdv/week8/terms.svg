<text x="850" y="441" text-anchor="middle" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#fff">East</text>
<circle cx="1000" cy="436" r="16" fill="#fff" stroke="#0c3354" stroke-width="3"/>
<text x="1000" y="474" text-anchor="middle" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="700" fill="#14181f">South</text>
