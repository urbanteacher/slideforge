<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
<rect width="1280" height="720" fill="#fbfaf8"/>
<text x="64" y="58" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="2.6" fill="#c8102e">RECALL FIRST</text>
<text x="64" y="100" font-family="'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif" font-size="36" fill="#14181f">Three questions on last week</text>
<text x="64" y="134" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-size="20" fill="#5a6572">No notes. Answer from memory, then we check.</text>
<circle cx="104" cy="235" r="32" fill="#eef1f5"/>
<g transform="translate(104 235) scale(1.000)"><path d="M0 18 C-10 4 -14 -2 -14 -6 a14 14 0 0 1 28 0 c0 4 -4 10 -14 24 z" fill="none" stroke="#0c3354" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><circle cy="-6" r="5" fill="#c8102e"/></g>
<text x="160" y="244.0" font-family="'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif" font-size="26" fill="#14181f">When is a map the right picture?</text>
<text x="640" y="243.1" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-size="23" fill="#5a6572">Talk to the person next to you: 20 seconds.</text>
<line x1="64" y1="310" x2="1216" y2="310" stroke="#d9d4ca" stroke-width="1.5"/>
<circle cx="104" cy="385" r="32" fill="#eef1f5"/>
<g transform="translate(104 385) scale(1.000)"><circle r="17" fill="none" stroke="#0c3354" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><ellipse rx="7" ry="17" fill="none" stroke="#0c3354" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M-17 0 h34" fill="none" stroke="#0c3354" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="160" y="379.0" font-family="'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif" font-size="26" fill="#14181f">Why does every flat map lie a</text>
<text x="160" y="409.0" font-family="'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif" font-size="26" fill="#14181f">little?</text>
<text x="640" y="393.1" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-size="23" fill="#5a6572">Talk to the person next to you: 20 seconds.</text>
<line x1="64" y1="460" x2="1216" y2="460" stroke="#d9d4ca" stroke-width="1.5"/>
<circle cx="104" cy="535" r="32" fill="#eef1f5"/>
<g transform="translate(104 535) scale(1.000)"><rect x="-18" y="-16" width="10" height="10" fill="#c6dbef"/><rect x="-5" y="-16" width="10" height="10" fill="#6baed6"/><rect x="8" y="-16" width="10" height="10" fill="#2171b5"/><path d="M-16 8 h32 M-16 15 h22" fill="none" stroke="#0c3354" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="160" y="529.0" font-family="'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif" font-size="26" fill="#14181f">Why colour a map by rate, not by</text>
<text x="160" y="559.0" font-family="'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif" font-size="26" fill="#14181f">count?</text>
<text x="640" y="543.0" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-size="23" fill="#5a6572">Talk to the person next to you: 20 seconds.</text>
</svg>