<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
<rect width="1280" height="720" fill="#fbfaf8"/>
<text x="64" y="58" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="2.6" fill="#c8102e">NAME IT</text>
<text x="64" y="100" font-family="'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif" font-size="36" fill="#14181f">Four ways to draw a tree</text>
<circle cx="104" cy="200" r="32" fill="#eef1f5"/>
<g transform="translate(104 200) scale(1.000)"><path d="M0 -14 L-12 4 M0 -14 L12 4 M-12 4 L-18 16 M-12 4 L-6 16" fill="none" stroke="#0c3354" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><circle cy="-14" r="4" fill="#0c3354"/><circle cx="-12" cy="4" r="4" fill="#0c3354"/><circle cx="12" cy="4" r="4" fill="#0c3354"/><circle cx="-18" cy="16" r="3.5" fill="#0c3354"/><circle cx="-6" cy="16" r="3.5" fill="#0c3354"/></g>
<text x="160" y="209.0" font-family="'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif" font-size="26" fill="#14181f">Dots and lines</text>
<text x="470" y="207.3" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-size="21" fill="#14181f">Who is under whom, very clearly. Size is invisible.</text>
<line x1="64" y1="260" x2="1216" y2="260" stroke="#d9d4ca" stroke-width="1.5"/>
<circle cx="104" cy="320" r="32" fill="#eef1f5"/>
<g transform="translate(104 320) scale(1.000)"><path d="M-18 -14 h22 M-10 -5 h22 M-10 4 h18 M-2 13 h18" fill="none" stroke="#0c3354" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="160" y="329.0" font-family="'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif" font-size="26" fill="#14181f">Indented list</text>
<text x="470" y="327.4" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-size="21" fill="#14181f">Reads like folders on a laptop; easy to label; long.</text>
<line x1="64" y1="380" x2="1216" y2="380" stroke="#d9d4ca" stroke-width="1.5"/>
<circle cx="104" cy="440" r="32" fill="#eef1f5"/>
<g transform="translate(104 440) scale(1.000)"><rect x="-20" y="-18" width="40" height="10" fill="#0c3354"/><rect x="-20" y="-6" width="24" height="10" fill="#4c78a8"/><rect x="6" y="-6" width="14" height="10" fill="#f58518"/><rect x="-20" y="6" width="10" height="10" fill="#4c78a8" opacity=".6"/><rect x="-8" y="6" width="12" height="10" fill="#4c78a8" opacity=".8"/><rect x="6" y="6" width="14" height="10" fill="#f58518" opacity=".7"/></g>
<text x="160" y="449.0" font-family="'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif" font-size="26" fill="#14181f">Icicle</text>
<text x="470" y="447.4" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-size="21" fill="#14181f">Each level a band; each piece as wide as its size.</text>
<line x1="64" y1="500" x2="1216" y2="500" stroke="#d9d4ca" stroke-width="1.5"/>
<circle cx="104" cy="560" r="32" fill="#eef1f5"/>
<g transform="translate(104 560) scale(1.000)"><rect x="-20" y="-18" width="22" height="36" fill="#4c78a8"/><rect x="4" y="-18" width="16" height="20" fill="#f58518"/><rect x="4" y="4" width="16" height="14" fill="#f58518" opacity=".6"/></g>
<text x="160" y="569.0" font-family="'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif" font-size="26" fill="#14181f">Treemap</text>
<text x="470" y="567.4" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-size="21" fill="#14181f">Boxes inside boxes: size as area. How deep it goes is harder to see.</text>
</svg>