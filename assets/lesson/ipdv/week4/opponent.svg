<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <rect width="1600" height="900" fill="#fbfaf8"/>
  <text x="80" y="92" font-family="'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif" font-size="54" fill="#14181f">Three cones, three channels</text><text x="80" y="138" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-size="24" fill="#5a6572" opacity="1">After the cones, the signal is recoded into opposite pairs (Hering, 1878)</text>
  <text x="250" y="210" text-anchor="middle" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-weight="700" font-size="20" letter-spacing="3" fill="#0c3354">CONES</text>
  <line x1="314" y1="640" x2="806" y2="282" stroke="#0c3354" stroke-opacity="0.55" stroke-width="3"/><line x1="314" y1="470" x2="806" y2="298" stroke="#0c3354" stroke-opacity="0.55" stroke-width="3"/><line x1="314" y1="640" x2="806" y2="472" stroke="#0c3354" stroke-opacity="0.55" stroke-width="3"/><line x1="314" y1="470" x2="806" y2="488" stroke="#c8102e" stroke-opacity="0.85" stroke-width="3" stroke-dasharray="9 7"/><line x1="314" y1="300" x2="806" y2="654" stroke="#0c3354" stroke-opacity="0.55" stroke-width="3"/><line x1="314" y1="640" x2="806" y2="670" stroke="#c8102e" stroke-opacity="0.85" stroke-width="3" stroke-dasharray="9 7"/><line x1="314" y1="470" x2="806" y2="686" stroke="#c8102e" stroke-opacity="0.85" stroke-width="3" stroke-dasharray="9 7"/><circle cx="250" cy="300" r="60" fill="#3f63d9"/><text x="250" y="314" text-anchor="middle" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-weight="700" font-size="40" fill="#fff">S</text><circle cx="250" cy="470" r="60" fill="#2e9e4f"/><text x="250" y="484" text-anchor="middle" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-weight="700" font-size="40" fill="#fff">M</text><circle cx="250" cy="640" r="60" fill="#d64532"/><text x="250" y="654" text-anchor="middle" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-weight="700" font-size="40" fill="#fff">L</text><defs><linearGradient id="ch0" x1="0" x2="1"><stop offset="0" stop-color="#111111"/><stop offset="1" stop-color="#ffffff"/></linearGradient></defs>
    <rect x="820" y="250" width="560" height="80" fill="url(#ch0)" stroke="rgba(12,51,84,.25)"/>
    <text x="820" y="234" font-family="'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif" font-size="36" fill="#14181f">Light – dark</text>
    <text x="1380" y="234" text-anchor="end" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-size="24" fill="#5a6572">L + M</text><defs><linearGradient id="ch1" x1="0" x2="1"><stop offset="0" stop-color="#d1323c"/><stop offset="1" stop-color="#2f9e55"/></linearGradient></defs>
    <rect x="820" y="440" width="560" height="80" fill="url(#ch1)" stroke="rgba(12,51,84,.25)"/>
    <text x="820" y="424" font-family="'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif" font-size="36" fill="#14181f">Red – green</text>
    <text x="1380" y="424" text-anchor="end" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-size="24" fill="#5a6572">L − M</text><defs><linearGradient id="ch2" x1="0" x2="1"><stop offset="0" stop-color="#2f59d9"/><stop offset="1" stop-color="#f2d230"/></linearGradient></defs>
    <rect x="820" y="630" width="560" height="80" fill="url(#ch2)" stroke="rgba(12,51,84,.25)"/>
    <text x="820" y="614" font-family="'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif" font-size="36" fill="#14181f">Blue – yellow</text>
    <text x="1380" y="614" text-anchor="end" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-size="24" fill="#5a6572">S − (L + M)</text>
  <line x1="420" y1="760" x2="480" y2="760" stroke="#0c3354" stroke-opacity=".55" stroke-width="3"/>
  <text x="492" y="768" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-size="22" fill="#5a6572">adds</text>
  <line x1="580" y1="760" x2="640" y2="760" stroke="#c8102e" stroke-width="3" stroke-dasharray="9 7"/>
  <text x="652" y="768" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-size="22" fill="#5a6572">subtracts</text>
  <text x="80" y="845" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-size="26" fill="#14181f">Each channel runs between two opposites, so nothing looks <tspan font-weight="700">reddish-green</tspan> or <tspan font-weight="700">bluish-yellow</tspan>.</text>
</svg>
