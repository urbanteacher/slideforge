  <text x="80" y="92" font-family="'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif" font-size="54" fill="#14181f">Colour isn’t in the light</text><text x="80" y="138" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-size="24" fill="#5a6572" opacity="1">Light is just wavelengths. Your eyes see about 380–700 nm of them</text>
  <rect x="110" y="650" width="1060" height="56" fill="url(#spec)"/>
  <line x1="176.25" y1="712" x2="176.25" y2="722" stroke="#5a6572" stroke-width="2"/><text x="176.25" y="748" text-anchor="middle" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-size="20" fill="#5a6572">400</text><line x1="341.875" y1="712" x2="341.875" y2="722" stroke="#5a6572" stroke-width="2"/><text x="341.875" y="748" text-anchor="middle" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-size="20" fill="#5a6572">450</text><line x1="507.5" y1="712" x2="507.5" y2="722" stroke="#5a6572" stroke-width="2"/><text x="507.5" y="748" text-anchor="middle" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-size="20" fill="#5a6572">500</text><line x1="673.125" y1="712" x2="673.125" y2="722" stroke="#5a6572" stroke-width="2"/><text x="673.125" y="748" text-anchor="middle" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-size="20" fill="#5a6572">550</text><line x1="838.75" y1="712" x2="838.75" y2="722" stroke="#5a6572" stroke-width="2"/><text x="838.75" y="748" text-anchor="middle" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-size="20" fill="#5a6572">600</text><line x1="1004.375" y1="712" x2="1004.375" y2="722" stroke="#5a6572" stroke-width="2"/><text x="1004.375" y="748" text-anchor="middle" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-size="20" fill="#5a6572">650</text><line x1="1170" y1="712" x2="1170" y2="722" stroke="#5a6572" stroke-width="2"/><text x="1170" y="748" text-anchor="middle" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-size="20" fill="#5a6572">700</text>
  <text x="1170" y="782" text-anchor="end" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-size="20" fill="#5a6572">wavelength (nm)</text>
  
  
  
  <text x="1260" y="300" font-family="'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif" font-size="64" fill="#14181f">120m</text>
  <text x="1260" y="338" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-size="22" fill="#5a6572">rods: night vision, no colour</text>
  <text x="1260" y="460" font-family="'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif" font-size="64" fill="#c8102e">6m</text>
  <text x="1260" y="498" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-size="22" fill="#5a6572">cones: colour, packed into</text>
