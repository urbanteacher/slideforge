<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <rect width="1600" height="900" fill="#fbfaf8"/>
  <text x="80" y="92" font-family="'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif" font-size="54" fill="#14181f">Colour in Altair</text><text x="80" y="138" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-size="24" fill="#5a6572" opacity="1">The type suffix (:Q, :O, :N) already picks sensible defaults: last week’s attribute types, paying off</text>
  <rect x="80" y="170" width="1180" height="660" fill="#071f35"/>
  <text x="110" y="215" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="22" fill="#ffffff" xml:space="preserve">import altair as alt</text>
  <text x="110" y="251" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="22" fill="#ffffff" xml:space="preserve"></text>
  <text x="110" y="287" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="22" fill="#8fa6bd" xml:space="preserve"># Sequential: quantitative magnitude</text>
  <text x="110" y="323" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="22" fill="#ffffff" xml:space="preserve">alt.Color('rent:Q', scale=alt.Scale(scheme='viridis'))</text><rect x="1290" y="298" width="128" height="34" fill="#c8102e"/><text x="1305" y="322" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-weight="700" font-size="18" letter-spacing="2" fill="#fff">MEASURE</text>
  <text x="110" y="359" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="22" fill="#ffffff" xml:space="preserve"></text>
  <text x="110" y="395" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="22" fill="#8fa6bd" xml:space="preserve"># Diverging: a meaningful midpoint at zero</text>
  <text x="110" y="431" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="22" fill="#ffffff" xml:space="preserve">alt.Color('profit:Q', scale=alt.Scale(scheme='redblue', domainMid=0))</text><rect x="1290" y="406" width="128" height="34" fill="#c8102e"/><text x="1305" y="430" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-weight="700" font-size="18" letter-spacing="2" fill="#fff">DIVERGE</text>
  <text x="110" y="467" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="22" fill="#ffffff" xml:space="preserve"></text>
  <text x="110" y="503" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="22" fill="#8fa6bd" xml:space="preserve"># Categorical: nominal groups</text>
  <text x="110" y="539" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="22" fill="#ffffff" xml:space="preserve">alt.Color('region:N', scale=alt.Scale(scheme='tableau10'))</text><rect x="1290" y="514" width="100" height="34" fill="#c8102e"/><text x="1305" y="538" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-weight="700" font-size="18" letter-spacing="2" fill="#fff">LABEL</text>
  <text x="110" y="575" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="22" fill="#ffffff" xml:space="preserve"></text>
  <text x="110" y="611" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="22" fill="#8fa6bd" xml:space="preserve"># Highlight: grey everything except one</text>
  <text x="110" y="647" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="22" fill="#ffffff" xml:space="preserve">alt.condition(alt.datum.brand == 'Netflix',</text><rect x="1290" y="622" width="156" height="34" fill="#c8102e"/><text x="1305" y="646" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-weight="700" font-size="18" letter-spacing="2" fill="#fff">HIGHLIGHT</text>
  <text x="110" y="683" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="22" fill="#ffffff" xml:space="preserve">              alt.value('#E50914'), alt.value('lightgrey'))</text>
  <text x="110" y="719" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="22" fill="#ffffff" xml:space="preserve"></text>
  <text x="110" y="755" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="22" fill="#8fa6bd" xml:space="preserve"># Classed scale: binning is a choice</text>
  <text x="110" y="791" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="22" fill="#ffffff" xml:space="preserve">alt.Color('rent:Q', scale=alt.Scale(type='quantile', scheme='blues'))</text><rect x="1290" y="766" width="128" height="34" fill="#c8102e"/><text x="1305" y="790" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-weight="700" font-size="18" letter-spacing="2" fill="#fff">BINNING</text>
</svg>
