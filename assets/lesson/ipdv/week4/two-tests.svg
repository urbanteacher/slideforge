<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <rect width="1600" height="900" fill="#fbfaf8"/>
  <text x="80" y="92" font-family="'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif" font-size="54" fill="#14181f">The two tests</text><text x="80" y="138" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-size="24" fill="#5a6572" opacity="1">Run both on every chart before anyone else sees it</text>
  <rect x="80" y="180" width="680" height="520" fill="#fff" stroke="rgba(12,51,84,.18)"/>
  <text x="110" y="232" font-family="'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif" font-size="36" fill="#14181f">1 · Greyscale</text>
  <text x="110" y="268" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-size="20" fill="#5a6572">Desaturate it. Does it still work?</text>
  <rect x="110" y="330" width="46" height="90" fill="#ef888e"/><rect x="166" y="300" width="46" height="120" fill="#c99f5a"/><rect x="222" y="360" width="46" height="60" fill="#79b474"/><rect x="278" y="320" width="46" height="100" fill="#00b9be"/><rect x="334" y="345" width="46" height="75" fill="#4fadf0"/><rect x="420" y="330" width="46" height="90" fill="#a6a6a6"/><rect x="476" y="300" width="46" height="120" fill="#a6a6a6"/><rect x="532" y="360" width="46" height="60" fill="#a6a6a6"/><rect x="588" y="320" width="46" height="100" fill="#a7a7a7"/><rect x="644" y="345" width="46" height="75" fill="#a5a5a5"/>
  <rect x="110" y="500" width="46" height="90" fill="#00579a"/><rect x="166" y="470" width="46" height="120" fill="#dd5853"/><rect x="222" y="530" width="46" height="60" fill="#87c060"/><rect x="278" y="490" width="46" height="100" fill="#ffd668"/><rect x="334" y="515" width="46" height="75" fill="#985191"/><rect x="420" y="500" width="46" height="90" fill="#555555"/><rect x="476" y="470" width="46" height="120" fill="#848484"/><rect x="532" y="530" width="46" height="60" fill="#b1b1b1"/><rect x="588" y="490" width="46" height="100" fill="#dadada"/><rect x="644" y="515" width="46" height="75" fill="#6b6b6b"/>
  <text x="110" y="640" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-size="20" fill="#14181f"><tspan font-weight="700" fill="#c8102e">✗</tspan> top: one grey  <tspan font-weight="700" fill="#0c3354">✓</tspan> bottom: five greys</text>
  <rect x="840" y="180" width="680" height="520" fill="#fff" stroke="rgba(12,51,84,.18)"/>
  <text x="870" y="232" font-family="'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif" font-size="36" fill="#14181f">2 · Colour blindness</text>
  <text x="870" y="268" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-size="20" fill="#5a6572">Simulate it. Can you still tell them apart?</text>
  <text x="870" y="320" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-size="18" fill="#5a6572">typical</text><text x="1170" y="320" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-size="18" fill="#5a6572">deuteranopia</text>
  <rect x="870" y="335" width="120" height="70" fill="#d62728"/><rect x="1000" y="335" width="120" height="70" fill="#2ca02c"/><rect x="1170" y="335" width="120" height="70" fill="#8b7c1f"/><rect x="1300" y="335" width="120" height="70" fill="#968838"/>
  <rect x="870" y="470" width="120" height="70" fill="#2166ac"/><rect x="1000" y="470" width="120" height="70" fill="#e08214"/><rect x="1170" y="470" width="120" height="70" fill="#2d5eab"/><rect x="1300" y="470" width="120" height="70" fill="#b5a215"/>
  <text x="870" y="640" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-size="20" fill="#14181f"><tspan font-weight="700" fill="#c8102e">✗</tspan> red–green merges  <tspan font-weight="700" fill="#0c3354">✓</tspan> blue–orange survives</text>
  <text x="80" y="770" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-size="23" fill="#14181f"><tspan font-weight="700">How:</tspan> Chrome DevTools → Rendering → Emulate vision deficiencies, or Coblis (color-blindness.com).</text>
  <text x="80" y="812" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-size="23" fill="#14181f"><tspan font-weight="700">Third test:</tspan> this room’s projector. The pale end of your sequential scale may just have vanished.</text>
</svg>
