  <text x="479" y="684" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-size="19" font-weight="400" fill="#14181f" text-anchor="start">2–5 parts that sum to 100%</text><text x="479" y="712" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-size="19" font-weight="400" fill="#0c3354" text-anchor="start">→ more parts? use a bar</text>
