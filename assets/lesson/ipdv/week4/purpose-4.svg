  <text x="842" y="276" font-family="'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif" font-size="28" font-weight="400" fill="#14181f" text-anchor="start">How did hires change</text><text x="842" y="310" font-family="'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif" font-size="28" font-weight="400" fill="#14181f" text-anchor="start">through 2024?</text>
