  <text x="479" y="276" font-family="'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif" font-size="28" font-weight="400" fill="#14181f" text-anchor="start">What share were</text><text x="479" y="310" font-family="'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif" font-size="28" font-weight="400" fill="#14181f" text-anchor="start">weekday hires?</text>
