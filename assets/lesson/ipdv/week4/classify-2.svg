<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <rect width="1600" height="900" fill="#fbfaf8"/>
  <text x="80" y="92" font-family="'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif" font-size="54" fill="#14181f">Sequential, diverging or categorical?</text><text x="80" y="138" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-size="24" fill="#5a6572" opacity="1">The answer depends on the task, not only on the data</text>
  <rect x="80" y="190" width="274" height="560" fill="#fff" stroke="rgba(12,51,84,.18)" stroke-width="1.5"/>
  <text x="102" y="236" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-weight="700" font-size="20" letter-spacing="3" fill="#c8102e">1</text>
  <foreignObject x="102" y="250" width="230" height="200"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif;font-size:32px;line-height:1.15;color:#14181f">Quarterly company profit</div>
  <div xmlns="http://www.w3.org/1999/xhtml" style="font-family:'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif;font-size:21px;line-height:1.3;color:#5a6572;margin-top:10px">including losses</div></foreignObject>
  <rect x="102" y="470" width="230" height="60" fill="#b2182b"/>
  <text x="217" y="510" text-anchor="middle" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-weight="700" font-size="24" fill="#fff">Diverging</text>
  <foreignObject x="102" y="548" width="230" height="190"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif;font-size:20px;line-height:1.35;color:#14181f">Midpoint 0. Sequential only if profit is always positive</div></foreignObject>
  <rect x="372" y="190" width="274" height="560" fill="#fff" stroke="rgba(12,51,84,.18)" stroke-width="1.5"/>
  <text x="394" y="236" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-weight="700" font-size="20" letter-spacing="3" fill="#c8102e">2</text>
  <foreignObject x="394" y="250" width="230" height="200"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif;font-size:32px;line-height:1.15;color:#14181f">Customer satisfaction</div>
  <div xmlns="http://www.w3.org/1999/xhtml" style="font-family:'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif;font-size:21px;line-height:1.3;color:#5a6572;margin-top:10px">rated 1–10</div></foreignObject>
  <rect x="394" y="470" width="230" height="60" fill="#2171b5"/>
  <text x="509" y="510" text-anchor="middle" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-weight="700" font-size="24" fill="#fff">Sequential</text>
  <foreignObject x="394" y="548" width="230" height="190"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif;font-size:20px;line-height:1.35;color:#14181f">Or diverging, if 5 is a true neutral. Ask what 5 means</div></foreignObject>
  <rect x="664" y="190" width="274" height="560" fill="#fff" stroke="rgba(12,51,84,.18)" stroke-width="1.5"/>
  <text x="686" y="236" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-weight="700" font-size="20" letter-spacing="3" fill="#c8102e">3</text>
  <foreignObject x="686" y="250" width="230" height="200"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif;font-size:32px;line-height:1.15;color:#14181f">Brexit result by area</div>
  <div xmlns="http://www.w3.org/1999/xhtml" style="font-family:'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif;font-size:21px;line-height:1.3;color:#5a6572;margin-top:10px">share voting Leave</div></foreignObject>
  <rect x="686" y="470" width="230" height="60" fill="#b2182b"/>
  <text x="801" y="510" text-anchor="middle" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-weight="700" font-size="24" fill="#fff">Diverging</text>
  <foreignObject x="686" y="548" width="230" height="190"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif;font-size:20px;line-height:1.35;color:#14181f">Midpoint 50%. Show only the winner and it is categorical</div></foreignObject>
  <rect x="956" y="190" width="274" height="560" fill="#fff" stroke="rgba(12,51,84,.18)" stroke-width="1.5"/>
  <text x="978" y="236" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-weight="700" font-size="20" letter-spacing="3" fill="#c8102e">4</text>
  <foreignObject x="978" y="250" width="230" height="200"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif;font-size:32px;line-height:1.15;color:#14181f">Global temperature</div>
  <div xmlns="http://www.w3.org/1999/xhtml" style="font-family:'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif;font-size:21px;line-height:1.3;color:#5a6572;margin-top:10px">anomaly against 1961–90</div></foreignObject>
  <rect x="978" y="470" width="230" height="60" fill="#b2182b"/>
  <text x="1093" y="510" text-anchor="middle" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-weight="700" font-size="24" fill="#fff">Diverging</text>
  <foreignObject x="978" y="548" width="230" height="190"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif;font-size:20px;line-height:1.35;color:#14181f">Midpoint at the baseline average</div></foreignObject>
  <rect x="1248" y="190" width="274" height="560" fill="#fff" stroke="rgba(12,51,84,.18)" stroke-width="1.5"/>
  <text x="1270" y="236" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-weight="700" font-size="20" letter-spacing="3" fill="#c8102e">5</text>
  <foreignObject x="1270" y="250" width="230" height="200"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif;font-size:32px;line-height:1.15;color:#14181f">Smartphone brands</div>
  <div xmlns="http://www.w3.org/1999/xhtml" style="font-family:'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif;font-size:21px;line-height:1.3;color:#5a6572;margin-top:10px">the best seller in each country</div></foreignObject>
  <rect x="1270" y="470" width="230" height="60" fill="#b07aa1"/>
  <text x="1385" y="510" text-anchor="middle" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-weight="700" font-size="24" fill="#fff">Categorical</text>
  <foreignObject x="1270" y="548" width="230" height="190"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif;font-size:20px;line-height:1.35;color:#14181f">One brand’s share would be sequential</div></foreignObject>
</svg>
