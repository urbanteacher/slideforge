<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <rect width="1600" height="900" fill="#fbfaf8"/>
  <text x="80" y="92" font-family="'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif" font-size="54" fill="#14181f">Sequential, diverging or categorical?</text><text x="80" y="138" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-size="24" fill="#5a6572" opacity="1">The answer depends on the task, not only on the data</text>
  <rect x="80" y="190" width="274" height="560" fill="#fff" stroke="rgba(12,51,84,.18)" stroke-width="1.5"/>
  <text x="102" y="236" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-weight="700" font-size="20" letter-spacing="3" fill="#c8102e">1</text>
  <text x="102" y="282" font-family="'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif" font-size="32" fill="#14181f"><tspan x="102" dy="0">Quarterly</tspan><tspan x="102" dy="36.8">company profit</tspan></text><text x="102" y="354.6" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-size="21" fill="#5a6572"><tspan x="102" dy="0">including losses</tspan></text>
  <rect x="102" y="470" width="230" height="60" fill="#b2182b"/>
  <text x="217" y="510" text-anchor="middle" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-weight="700" font-size="24" fill="#fff">Diverging</text>
  <text x="102" y="568" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-size="20" fill="#14181f"><tspan x="102" dy="0">Midpoint 0. Sequential</tspan><tspan x="102" dy="27">only if profit is</tspan><tspan x="102" dy="27">always positive</tspan></text>
  <rect x="372" y="190" width="274" height="560" fill="#fff" stroke="rgba(12,51,84,.18)" stroke-width="1.5"/>
  <text x="394" y="236" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-weight="700" font-size="20" letter-spacing="3" fill="#c8102e">2</text>
  <text x="394" y="282" font-family="'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif" font-size="32" fill="#14181f"><tspan x="394" dy="0">Customer</tspan><tspan x="394" dy="36.8">satisfaction</tspan></text><text x="394" y="354.6" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-size="21" fill="#5a6572"><tspan x="394" dy="0">rated 1–10</tspan></text>
  <rect x="394" y="470" width="230" height="60" fill="#2171b5"/>
  <text x="509" y="510" text-anchor="middle" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-weight="700" font-size="24" fill="#fff">Sequential</text>
  <text x="394" y="568" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-size="20" fill="#14181f"><tspan x="394" dy="0">Or diverging, if 5 is a</tspan><tspan x="394" dy="27">true neutral. Ask what</tspan><tspan x="394" dy="27">5 means</tspan></text>
  <rect x="664" y="190" width="274" height="560" fill="#fff" stroke="rgba(12,51,84,.18)" stroke-width="1.5"/>
  <text x="686" y="236" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-weight="700" font-size="20" letter-spacing="3" fill="#c8102e">3</text>
  <text x="686" y="282" font-family="'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif" font-size="32" fill="#14181f"><tspan x="686" dy="0">Brexit result</tspan><tspan x="686" dy="36.8">by area</tspan></text><text x="686" y="354.6" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-size="21" fill="#5a6572"><tspan x="686" dy="0">share voting Leave</tspan></text>
  <rect x="686" y="470" width="230" height="60" fill="#b2182b"/>
  <text x="801" y="510" text-anchor="middle" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-weight="700" font-size="24" fill="#fff">Diverging</text>
  <text x="686" y="568" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-size="20" fill="#14181f"><tspan x="686" dy="0">Midpoint 50%. Show only</tspan><tspan x="686" dy="27">the winner and it is</tspan><tspan x="686" dy="27">categorical</tspan></text>
  <rect x="956" y="190" width="274" height="560" fill="#fff" stroke="rgba(12,51,84,.18)" stroke-width="1.5"/>
  <text x="978" y="236" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-weight="700" font-size="20" letter-spacing="3" fill="#c8102e">4</text>
  <text x="978" y="282" font-family="'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif" font-size="32" fill="#14181f"><tspan x="978" dy="0">Global</tspan><tspan x="978" dy="36.8">temperature</tspan></text><text x="978" y="354.6" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-size="21" fill="#5a6572"><tspan x="978" dy="0">anomaly against</tspan><tspan x="978" dy="27.3">1961–90</tspan></text>
  <rect x="978" y="470" width="230" height="60" fill="#b2182b"/>
  <text x="1093" y="510" text-anchor="middle" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-weight="700" font-size="24" fill="#fff">Diverging</text>
  <text x="978" y="568" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-size="20" fill="#14181f"><tspan x="978" dy="0">Midpoint at the</tspan><tspan x="978" dy="27">baseline average</tspan></text>
  <rect x="1248" y="190" width="274" height="560" fill="#fff" stroke="rgba(12,51,84,.18)" stroke-width="1.5"/>
  <text x="1270" y="236" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-weight="700" font-size="20" letter-spacing="3" fill="#c8102e">5</text>
  <text x="1270" y="282" font-family="'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif" font-size="32" fill="#14181f"><tspan x="1270" dy="0">Smartphone</tspan><tspan x="1270" dy="36.8">brands</tspan></text><text x="1270" y="354.6" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-size="21" fill="#5a6572"><tspan x="1270" dy="0">the best seller in</tspan><tspan x="1270" dy="27.3">each country</tspan></text>
  <rect x="1270" y="470" width="230" height="60" fill="#b07aa1"/>
  <text x="1385" y="510" text-anchor="middle" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-weight="700" font-size="24" fill="#fff">Categorical</text>
  <text x="1270" y="568" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-size="20" fill="#14181f"><tspan x="1270" dy="0">One brand’s share would</tspan><tspan x="1270" dy="27">be sequential</tspan></text>
</svg>
