<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <rect width="1600" height="900" fill="#fbfaf8"/>
  <text x="80" y="92" font-family="'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif" font-size="54" fill="#14181f">Colour checklist</text><text x="80" y="138" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-size="24" fill="#5a6572" opacity="1">Eight questions for any chart. Each one is a part of today</text>
  <circle cx="110" cy="226" r="28" fill="#0c3354"/><text x="110" y="237" text-anchor="middle" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-weight="700" font-size="28" fill="#fff">1</text>
  <text x="160" y="222" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-size="25" fill="#14181f">What type is the attribute: categorical,</text><text x="160" y="254" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-size="25" fill="#14181f">ordered, or diverging around a</text><text x="160" y="286" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-size="25" fill="#14181f">meaningful middle?</text>
  <text x="160" y="326" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-weight="700" font-size="16" letter-spacing="3" fill="#c8102e">MAP</text><circle cx="110" cy="376" r="28" fill="#0c3354"/><text x="110" y="387" text-anchor="middle" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-weight="700" font-size="28" fill="#fff">2</text>
  <text x="160" y="372" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-size="25" fill="#14181f">Is colour the right channel, or would</text><text x="160" y="404" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-size="25" fill="#14181f">position do it better?</text>
  <text x="160" y="444" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-weight="700" font-size="16" letter-spacing="3" fill="#c8102e">USE</text><circle cx="110" cy="526" r="28" fill="#0c3354"/><text x="110" y="537" text-anchor="middle" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-weight="700" font-size="28" fill="#fff">3</text>
  <text x="160" y="522" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-size="25" fill="#14181f">Is lightness doing the ordering work?</text>
  <text x="160" y="562" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-weight="700" font-size="16" letter-spacing="3" fill="#c8102e">VOCABULARY</text><circle cx="110" cy="676" r="28" fill="#0c3354"/><text x="110" y="687" text-anchor="middle" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-weight="700" font-size="28" fill="#fff">4</text>
  <text x="160" y="672" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-size="25" fill="#14181f">At most 6–12 categories, the rest</text><text x="160" y="704" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-size="25" fill="#14181f">grouped or greyed?</text>
  <text x="160" y="744" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-weight="700" font-size="16" letter-spacing="3" fill="#c8102e">MAP</text><circle cx="850" cy="226" r="28" fill="#0c3354"/><text x="850" y="237" text-anchor="middle" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-weight="700" font-size="28" fill="#fff">5</text>
  <text x="900" y="222" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-size="25" fill="#14181f">Does it pass the greyscale and</text><text x="900" y="254" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-size="25" fill="#14181f">colour-blindness tests?</text>
  <text x="900" y="294" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-weight="700" font-size="16" letter-spacing="3" fill="#c8102e">CHECK</text><circle cx="850" cy="376" r="28" fill="#0c3354"/><text x="850" y="387" text-anchor="middle" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-weight="700" font-size="28" fill="#fff">6</text>
  <text x="900" y="372" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-size="25" fill="#14181f">Is information carried by more than</text><text x="900" y="404" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-size="25" fill="#14181f">colour alone?</text>
  <text x="900" y="444" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-weight="700" font-size="16" letter-spacing="3" fill="#c8102e">CHECK</text><circle cx="850" cy="526" r="28" fill="#0c3354"/><text x="850" y="537" text-anchor="middle" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-weight="700" font-size="28" fill="#fff">7</text>
  <text x="900" y="522" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-size="25" fill="#14181f">Do the colours fit the meaning, the</text><text x="900" y="554" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-size="25" fill="#14181f">culture and the background?</text>
  <text x="900" y="594" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-weight="700" font-size="16" letter-spacing="3" fill="#c8102e">MEAN</text><circle cx="850" cy="676" r="28" fill="#0c3354"/><text x="850" y="687" text-anchor="middle" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-weight="700" font-size="28" fill="#fff">8</text>
  <text x="900" y="672" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-size="25" fill="#14181f">Is colour scarce enough to highlight</text><text x="900" y="704" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-size="25" fill="#14181f">what matters?</text>
  <text x="900" y="744" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-weight="700" font-size="16" letter-spacing="3" fill="#c8102e">NOTICE</text>
</svg>
