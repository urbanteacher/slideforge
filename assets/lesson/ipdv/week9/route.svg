<text x="64" y="560" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#5a6572">Weeks 1–8 taught you to make a chart right. Today: who reads it, in what order, and who is in control.</text>
<text x="64" y="594" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#5a6572">Your final infographic is a story. Every panel needs a headline, a note and a highlight.</text>
