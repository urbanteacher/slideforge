<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
<rect width="1280" height="720" fill="#fbfaf8"/>
<text x="64" y="58" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="2.6" fill="#c8102e">BUILD IT</text>
<text x="64" y="100" font-family="'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif" font-size="36" fill="#14181f">Tell the public: the honest comparison</text>
<rect x="40" y="128" width="640" height="560" rx="6" fill="#0a2a45"/>
<rect x="40" y="140.7" width="6" height="22.8" fill="#c8102e"/>
<text x="64" y="158.0" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="14.9" fill="#ffffff">hit&#160;=&#160;unique['track_popularity']&#160;&gt;=&#160;80&#160;&#160;&#160;&#160;&#160;#&#160;a&#160;&quot;hit&quot;</text>
<text x="64" y="182.8" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="14.9" fill="#ffffff">X_tr,&#160;X_te,&#160;h_tr,&#160;h_te&#160;=&#160;train_test_split(</text>
<rect x="40" y="190.2" width="6" height="22.8" fill="#c8102e"/>
<text x="64" y="207.5" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="14.9" fill="#ffffff">&#160;&#160;&#160;&#160;X,&#160;hit,&#160;test_size=0.25,&#160;random_state=0,&#160;stratify=hit)</text>
<text x="64" y="232.3" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="14.9" fill="#ffffff">spotter&#160;=&#160;RandomForestClassifier(300,&#160;random_state=0)</text>
<text x="64" y="257.0" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="14.9" fill="#ffffff">guess&#160;=&#160;spotter.fit(X_tr,&#160;h_tr).predict(X_te)</text>
<text x="64" y="281.8" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="14.9" fill="#ffffff"></text>
<text x="64" y="306.6" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="14.9" fill="#ffffff">scores&#160;=&#160;pd.DataFrame({'claim':&#160;[</text>
<text x="64" y="331.3" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="14.9" fill="#ffffff">&#160;&#160;&#160;&#160;'the&#160;hit&#160;model&#160;is&#160;right',</text>
<text x="64" y="356.1" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="14.9" fill="#ffffff">&#160;&#160;&#160;&#160;'saying&#160;&quot;not&#160;a&#160;hit&quot;&#160;every&#160;time&#160;is&#160;right',</text>
<text x="64" y="380.9" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="14.9" fill="#ffffff">&#160;&#160;&#160;&#160;'real&#160;hits&#160;the&#160;model&#160;found'],</text>
<rect x="40" y="388.3" width="6" height="22.8" fill="#c8102e"/>
<text x="64" y="405.6" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="14.9" fill="#ffffff">&#160;&#160;'share':&#160;[(guess&#160;==&#160;h_te).mean(),&#160;1&#160;-&#160;h_te.mean(),</text>
<text x="64" y="430.4" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="14.9" fill="#ffffff">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;guess[h_te.to_numpy()].mean()]})</text>
<text x="64" y="455.1" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="14.9" fill="#ffffff"></text>
<text x="64" y="479.9" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="14.9" fill="#ffffff">alt.Chart(scores).mark_bar(color='#0c3354').encode(</text>
<text x="64" y="504.7" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="14.9" fill="#ffffff">&#160;&#160;&#160;&#160;x=alt.X('share:Q',&#160;axis=alt.Axis(format='%'),</text>
<text x="64" y="529.4" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="14.9" fill="#ffffff">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;scale=alt.Scale(domain=[0,&#160;1]),&#160;title=None),</text>
<text x="64" y="554.2" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="14.9" fill="#ffffff">&#160;&#160;&#160;&#160;y=alt.Y('claim:N',&#160;sort=None,&#160;title=None),</text>
<text x="64" y="579.0" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="14.9" fill="#ffffff">).properties(width=420,&#160;height=180)&#160;+&#160;alt.Chart(scores).mark_text(</text>
<text x="64" y="603.7" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="14.9" fill="#ffffff">&#160;&#160;&#160;&#160;align='left',&#160;dx=6).encode(</text>
<text x="64" y="628.5" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="14.9" fill="#ffffff">&#160;&#160;&#160;&#160;x='share:Q',&#160;y=alt.Y('claim:N',&#160;sort=None),</text>
<text x="64" y="653.2" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="14.9" fill="#ffffff">&#160;&#160;&#160;&#160;text=alt.Text('share:Q',&#160;format='.1%'))</text>
