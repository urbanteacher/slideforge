<text x="710" y="461" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#5a6572">week10_build_its.py</text>
<rect x="710" y="478" width="5" height="18" fill="#c8102e"/>
<text x="726" y="493" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#0c3354">&gt;=&#160;80</text>
<text x="726" y="515" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#14181f">A “hit”, as the headline means it.</text>
<rect x="710" y="529" width="5" height="18" fill="#c8102e"/>
<text x="726" y="544" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#0c3354">stratify=hit</text>
<text x="726" y="566" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#14181f">Keep the same few hits in the test songs as in the data.</text>
<rect x="710" y="580" width="5" height="18" fill="#c8102e"/>
<text x="726" y="595" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#0c3354">1&#160;-&#160;h_te.mean()</text>
<text x="726" y="617" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#14181f">The baseline: always say “not a hit”.</text>
<rect x="710" y="631" width="5" height="18" fill="#c8102e"/>
<text x="726" y="646" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#0c3354">The&#160;picture</text>
<text x="726" y="668" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#14181f">Accuracy, the baseline and hits found, on one 0–100% axis.</text>
