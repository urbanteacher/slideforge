<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
<rect width="1280" height="720" fill="#fbfaf8"/>
<text x="64" y="58" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="2.6" fill="#c8102e">BUILD IT</text>
<text x="64" y="100" font-family="'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif" font-size="36" fill="#14181f">Look first: what does popularity look like?</text>
<rect x="40" y="128" width="640" height="560" rx="6" fill="#0a2a45"/>
<text x="64" y="158.0" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="16.5" fill="#9fb7cf">#&#160;The&#160;file&#160;is&#160;sorted&#160;by&#160;playlist.&#160;Shuffle&#160;it&#160;once,&#160;so&#160;any</text>
<text x="64" y="184.0" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="16.5" fill="#9fb7cf">#&#160;slice&#160;of&#160;it&#160;(a&#160;sample,&#160;a&#160;test&#160;set)&#160;mixes&#160;every&#160;genre.</text>
<rect x="40" y="191.8" width="6" height="23.9" fill="#c8102e"/>
<text x="64" y="210.0" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="16.5" fill="#ffffff">unique&#160;=&#160;(songs.drop_duplicates('track_id')</text>
<rect x="40" y="217.8" width="6" height="23.9" fill="#c8102e"/>
<text x="64" y="236.0" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="16.5" fill="#ffffff">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;.sample(frac=1,&#160;random_state=0))</text>
<rect x="40" y="243.8" width="6" height="23.9" fill="#c8102e"/>
<text x="64" y="262.0" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="16.5" fill="#ffffff">sample&#160;=&#160;unique.sample(4000,&#160;random_state=0)</text>
<text x="64" y="288.0" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="16.5" fill="#ffffff"></text>
<rect x="40" y="295.8" width="6" height="23.9" fill="#c8102e"/>
<text x="64" y="314.0" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="16.5" fill="#ffffff">alt.Chart(sample).mark_bar().encode(</text>
<rect x="40" y="321.8" width="6" height="23.9" fill="#c8102e"/>
<text x="64" y="340.0" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="16.5" fill="#ffffff">&#160;&#160;&#160;&#160;x=alt.X('track_popularity:Q',&#160;bin=alt.Bin(step=2),</text>
<text x="64" y="366.0" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="16.5" fill="#ffffff">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;title='popularity&#160;(0&#160;to&#160;100)'),</text>
<rect x="40" y="373.8" width="6" height="23.9" fill="#c8102e"/>
<text x="64" y="392.0" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="16.5" fill="#ffffff">&#160;&#160;&#160;&#160;y=alt.Y('count()',&#160;title='songs'),</text>
<text x="64" y="418.0" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="16.5" fill="#ffffff">).properties(width=520,&#160;height=300)</text>
<rect x="710" y="128" width="530" height="290" fill="#fff" stroke="#d9d4ca"/>
<image href="data:image/png;base64," x="736.8" y="128.0" width="476.4" height="290.0"/>
<text x="710" y="442" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#5a6572">The picture this code drew, after the setup at the top of</text>
<text x="710" y="461" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#5a6572">week10_build_its.py</text>
<rect x="710" y="478" width="5" height="18" fill="#c8102e"/>
<text x="726" y="493" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#0c3354">drop_duplicates</text>
<text x="726" y="515" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#14181f">One row per song, then shuffled: the file is sorted.</text>
<rect x="710" y="529" width="5" height="18" fill="#c8102e"/>
<text x="726" y="544" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#0c3354">sample(4000)</text>
<text x="726" y="566" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#14181f">Altair draws up to 5,000 rows: plenty for a shape.</text>
<rect x="710" y="580" width="5" height="18" fill="#c8102e"/>
<text x="726" y="595" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#0c3354">bin=alt.Bin(step=2)</text>
<text x="726" y="617" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#14181f">A histogram: songs counted per band.</text>
<rect x="710" y="631" width="5" height="18" fill="#c8102e"/>
<text x="726" y="646" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#0c3354">The&#160;picture</text>
<text x="726" y="668" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#14181f">A tower at 0. Not rated yet? We keep them and say so.</text>
</svg>