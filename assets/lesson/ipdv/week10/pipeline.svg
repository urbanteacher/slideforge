<text x="64" y="650" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#5a6572">Each stop: see it, name it, the library’s one line, then build it in Altair. All on one dataset: about 30,000 songs.</text>
