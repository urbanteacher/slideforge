<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
<rect width="1280" height="720" fill="#fbfaf8"/>
<text x="64" y="58" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="2.6" fill="#c8102e">THE LIBRARY WAY</text>
<text x="64" y="100" font-family="'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif" font-size="36" fill="#14181f">Look first, in three lines</text>
<rect x="40" y="128" width="640" height="560" rx="6" fill="#0a2a45"/>
<text x="64" y="158.0" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="16.5" fill="#ffffff">import&#160;seaborn&#160;as&#160;sns</text>
<text x="64" y="184.0" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="16.5" fill="#ffffff"></text>
<rect x="40" y="191.8" width="6" height="23.9" fill="#c8102e"/>
<text x="64" y="210.0" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="16.5" fill="#ffffff">songs.isna().sum()&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;#&#160;missing&#160;values,&#160;per&#160;column</text>
<rect x="40" y="217.8" width="6" height="23.9" fill="#c8102e"/>
<text x="64" y="236.0" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="16.5" fill="#ffffff">songs.duplicated('track_id').sum()&#160;&#160;&#160;#&#160;the&#160;same&#160;song&#160;twice</text>
<text x="64" y="262.0" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="16.5" fill="#ffffff"></text>
<rect x="40" y="269.8" width="6" height="23.9" fill="#c8102e"/>
<text x="64" y="288.0" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="16.5" fill="#ffffff">sns.histplot(songs,&#160;x='track_popularity',&#160;bins=50)</text>
<rect x="710" y="128" width="530" height="330" fill="#fff" stroke="#d9d4ca"/>
<image href="data:image/png;base64," x="754.2" y="128.0" width="441.6" height="330.0"/>
<text x="710" y="482" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#5a6572">What the library draws, with its own defaults</text>
<rect x="710" y="499" width="5" height="18" fill="#c8102e"/>
<text x="726" y="514" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#0c3354">isna().sum()</text>
<text x="726" y="536" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#14181f">How many blanks in each column.</text>
<rect x="710" y="550" width="5" height="18" fill="#c8102e"/>
<text x="726" y="565" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#0c3354">duplicated(…)</text>
<text x="726" y="587" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#14181f">The same song more than once.</text>
<rect x="710" y="601" width="5" height="18" fill="#c8102e"/>
<text x="726" y="616" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#0c3354">sns.histplot</text>
<text x="726" y="638" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#14181f">A histogram in one line, with seaborn’s defaults.</text>
</svg>