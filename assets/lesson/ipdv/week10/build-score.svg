<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
<rect width="1280" height="720" fill="#fbfaf8"/>
<text x="64" y="58" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="2.6" fill="#c8102e">BUILD IT</text>
<text x="64" y="100" font-family="'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif" font-size="36" fill="#14181f">Score it: right, compared with what, for whom?</text>
<rect x="40" y="128" width="640" height="560" rx="6" fill="#0a2a45"/>
<rect x="40" y="139.8" width="6" height="23.9" fill="#c8102e"/>
<text x="64" y="158.0" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="15.9" fill="#ffffff">guess&#160;=&#160;model.predict(X_te)&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;#&#160;songs&#160;it&#160;never&#160;saw</text>
<rect x="40" y="165.8" width="6" height="23.9" fill="#c8102e"/>
<text x="64" y="184.0" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="15.9" fill="#ffffff">accuracy&#160;=&#160;(guess&#160;==&#160;y_te).mean()&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;#&#160;share&#160;it&#160;got&#160;right</text>
<rect x="40" y="191.8" width="6" height="23.9" fill="#c8102e"/>
<text x="64" y="210.0" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="15.9" fill="#ffffff">baseline&#160;=&#160;y_te.value_counts(normalize=True).max()</text>
<text x="64" y="236.0" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="15.9" fill="#ffffff">labels&#160;=&#160;sorted(y.unique())</text>
<rect x="40" y="243.8" width="6" height="23.9" fill="#c8102e"/>
<text x="64" y="262.0" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="15.9" fill="#ffffff">found&#160;=&#160;pd.DataFrame({'genre':&#160;labels,&#160;'recall':&#160;[</text>
<text x="64" y="288.0" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="15.9" fill="#ffffff">&#160;&#160;&#160;&#160;(guess[y_te&#160;==&#160;g]&#160;==&#160;g).mean()&#160;for&#160;g&#160;in&#160;labels]})</text>
<text x="64" y="314.0" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="15.9" fill="#ffffff"></text>
<text x="64" y="340.0" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="15.9" fill="#ffffff">bars&#160;=&#160;alt.Chart(found).mark_bar().encode(</text>
<rect x="40" y="347.8" width="6" height="23.9" fill="#c8102e"/>
<text x="64" y="366.0" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="15.9" fill="#ffffff">&#160;&#160;&#160;&#160;x=alt.X('recall:Q',&#160;axis=alt.Axis(format='%'),</text>
<text x="64" y="392.0" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="15.9" fill="#ffffff">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;scale=alt.Scale(domain=[0,&#160;1]),</text>
<text x="64" y="418.0" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="15.9" fill="#ffffff">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;title='share&#160;of&#160;each&#160;genre’s&#160;songs&#160;it&#160;got&#160;right'),</text>
<text x="64" y="444.0" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="15.9" fill="#ffffff">&#160;&#160;&#160;&#160;y=alt.Y('genre:N',&#160;sort='-x',&#160;title=None),</text>
<text x="64" y="470.0" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="15.9" fill="#ffffff">&#160;&#160;&#160;&#160;color=genre.legend(None))</text>
<text x="64" y="496.0" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="15.9" fill="#ffffff">lines&#160;=&#160;alt.Chart(pd.DataFrame({'at':&#160;[accuracy,&#160;baseline],</text>
<text x="64" y="522.0" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="15.9" fill="#ffffff">&#160;&#160;&#160;&#160;'what':&#160;['all&#160;songs',&#160;'always&#160;the&#160;commonest&#160;genre']})</text>
<text x="64" y="548.0" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="15.9" fill="#ffffff">).mark_rule(strokeDash=[5,&#160;3]).encode(x='at:Q')</text>
<text x="64" y="574.0" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="15.9" fill="#ffffff">names&#160;=&#160;lines.mark_text(align='left',&#160;dx=4,&#160;y=-8).encode(</text>
<text x="64" y="600.0" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="15.9" fill="#ffffff">&#160;&#160;&#160;&#160;text='what:N')</text>
<text x="64" y="626.0" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="15.9" fill="#ffffff">(bars&#160;+&#160;lines&#160;+&#160;names).properties(width=420,&#160;height=230)</text>
<rect x="710" y="128" width="530" height="330" fill="#fff" stroke="#d9d4ca"/>
<image href="data:image/png;base64," x="710.8" y="128.0" width="528.5" height="330.0"/>
<text x="710" y="482" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#5a6572">The picture this code drew: each genre’s score, with the two lines</text>
<text x="710" y="501" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#5a6572">to compare</text>
<rect x="710" y="518" width="5" height="18" fill="#c8102e"/>
<text x="726" y="533" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#0c3354">accuracy</text>
<text x="726" y="555" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#14181f">Share of test songs it got right: 3,988 of 7,089, 56%.</text>
<rect x="710" y="569" width="5" height="18" fill="#c8102e"/>
<text x="726" y="584" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#0c3354">baseline</text>
<text x="726" y="606" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#14181f">Always guess the commonest genre: 19%. Beat it, or nothing</text>
<text x="726" y="627" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#14181f">was learnt.</text>
<rect x="710" y="641" width="5" height="18" fill="#c8102e"/>
<text x="726" y="656" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#0c3354">recall</text>
<text x="726" y="678" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#14181f">For one genre: the share of its real songs the model got</text>
<text x="726" y="699" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#14181f">right.</text>
</svg>