<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
<rect width="1280" height="720" fill="#fbfaf8"/>
<text x="64" y="58" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="2.6" fill="#c8102e">BUILD IT</text>
<text x="64" y="100" font-family="'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif" font-size="36" fill="#14181f">Set up: the songs, their ten numbers, one colour per genre</text>
<rect x="40" y="128" width="640" height="560" rx="6" fill="#0a2a45"/>
<text x="64" y="158.0" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="15.9" fill="#ffffff">import&#160;altair&#160;as&#160;alt</text>
<text x="64" y="184.0" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="15.9" fill="#ffffff">import&#160;pandas&#160;as&#160;pd</text>
<text x="64" y="210.0" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="15.9" fill="#ffffff"></text>
<text x="64" y="236.0" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="15.9" fill="#ffffff">songs&#160;=&#160;pd.read_csv('songs.csv')</text>
<rect x="40" y="243.8" width="6" height="23.9" fill="#c8102e"/>
<text x="64" y="262.0" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="15.9" fill="#ffffff">FEATURES&#160;=&#160;['danceability',&#160;'energy',&#160;'loudness',</text>
<text x="64" y="288.0" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="15.9" fill="#ffffff">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;'speechiness',&#160;'acousticness',&#160;'instrumentalness',</text>
<text x="64" y="314.0" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="15.9" fill="#ffffff">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;'liveness',&#160;'valence',&#160;'tempo',&#160;'duration_ms']</text>
<text x="64" y="340.0" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="15.9" fill="#9fb7cf">#&#160;Okabe&#160;and&#160;Ito's&#160;colour-blind-safe&#160;colours,&#160;one&#160;per&#160;genre</text>
<rect x="40" y="347.8" width="6" height="23.9" fill="#c8102e"/>
<text x="64" y="366.0" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="15.9" fill="#ffffff">genre&#160;=&#160;alt.Color('playlist_genre:N',&#160;title='genre',</text>
<text x="64" y="392.0" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="15.9" fill="#ffffff">&#160;&#160;&#160;&#160;scale=alt.Scale(</text>
<text x="64" y="418.0" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="15.9" fill="#ffffff">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;domain=['edm',&#160;'latin',&#160;'pop',&#160;'r&amp;b',&#160;'rap',&#160;'rock'],</text>
<text x="64" y="444.0" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="15.9" fill="#ffffff">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;range=['#0072b2',&#160;'#e69f00',&#160;'#cc79a7',&#160;'#009e73',</text>
<text x="64" y="470.0" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="15.9" fill="#ffffff">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;'#d55e00',&#160;'#56b4e9']))</text>
<text x="64" y="496.0" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="15.9" fill="#ffffff"></text>
<text x="64" y="522.0" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="15.9" fill="#9fb7cf">#&#160;How&#160;many&#160;songs&#160;in&#160;each&#160;genre?</text>
<text x="64" y="548.0" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="15.9" fill="#ffffff">alt.Chart(songs).mark_bar().encode(</text>
<rect x="40" y="555.8" width="6" height="23.9" fill="#c8102e"/>
<text x="64" y="574.0" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="15.9" fill="#ffffff">&#160;&#160;&#160;&#160;x=alt.X('count()',&#160;title='rows&#160;in&#160;the&#160;file'),</text>
<text x="64" y="600.0" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="15.9" fill="#ffffff">&#160;&#160;&#160;&#160;y=alt.Y('playlist_genre:N',&#160;sort='-x',&#160;title=None),</text>
<text x="64" y="626.0" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="15.9" fill="#ffffff">&#160;&#160;&#160;&#160;color=genre.legend(None),</text>
<text x="64" y="652.0" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="15.9" fill="#ffffff">).properties(width=420,&#160;height=220)</text>
<rect x="710" y="128" width="530" height="330" fill="#fff" stroke="#d9d4ca"/>
<image href="data:image/png;base64," x="710.0" y="141.4" width="530.0" height="303.2"/>
<text x="710" y="482" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#5a6572">The picture this code drew: rows per genre in the file</text>
<rect x="710" y="499" width="5" height="18" fill="#c8102e"/>
<text x="726" y="514" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#0c3354">FEATURES</text>
<text x="726" y="536" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#14181f">The ten numbers a model reads about each song: its features.</text>
<rect x="710" y="550" width="5" height="18" fill="#c8102e"/>
<text x="726" y="565" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#0c3354">genre&#160;=&#160;alt.Color</text>
<text x="726" y="587" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#14181f">One colour per genre, safe for colour-blind readers, on</text>
<text x="726" y="608" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#14181f">every chart.</text>
<rect x="710" y="622" width="5" height="18" fill="#c8102e"/>
<text x="726" y="637" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#0c3354">count()</text>
<text x="726" y="659" font-family="'Avenir Next', Avenir, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#14181f">Six genres, each with about 5,000 to 6,000 rows.</text>
</svg>