<text x="110" y="230" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="24" font-weight="600" fill="#ff4d3d" letter-spacing="4">CASE FILE 01 · MODEL · PLAIER</text><text x="104" y="380" font-family="Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif" font-size="120" font-weight="400" fill="#f1ede4">THE SEASON,</text><text x="104" y="492" font-family="Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif" font-size="120" font-weight="400" fill="#f1ede4">PLAYED</text><text x="104" y="604" font-family="Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif" font-size="120" font-weight="400" fill="#f1ede4">100,000 TIMES</text><rect x="110" y="664" width="760" height="96" fill="none" stroke="#ff4d3d" stroke-width="3"/><text x="134" y="702" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="18" font-weight="700" fill="#ff4d3d" letter-spacing="2">THE JOB IT SHOWS</text><text x="134" y="742" font-family="'Avenir Next', 'Helvetica Neue', Arial, sans-serif" font-size="32" font-weight="700" fill="#f1ede4">Model builder at an AI supplier</text><rect x="1010" y="190" width="810" height="720" fill="#191b21"/><rect x="1010" y="190" width="10" height="720" fill="#ff4d3d"/><text x="1070" y="360" font-family="Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif" font-size="130" font-weight="400" fill="#ff4d3d">100+</text><text x="1070" y="410" font-family="'Avenir Next', 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="500" fill="#f1ede4">leagues in the company’s football database</text><path d="M1070 460H1760" stroke="#f1ede4" stroke-width="1.5" opacity="0.2"/><text x="1070" y="590" font-family="Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif" font-size="130" font-weight="400" fill="#ff4d3d">100,000</text><text x="1070" y="640" font-family="'Avenir Next', 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="500" fill="#f1ede4">times it plays out a signing’s season,</text><text x="1070" y="676" font-family="'Avenir Next', 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="500" fill="#f1ede4">38 games against each opponent</text><path d="M1070 690H1760" stroke="#f1ede4" stroke-width="1.5" opacity="0.2"/><text x="1070" y="820" font-family="Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif" font-size="130" font-weight="400" fill="#ff4d3d">4</text><text x="1070" y="870" font-family="'Avenir Next', 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="500" fill="#f1ede4">Premier League clubs working with it</text><path d="M44 70V44H70" stroke="#f1ede4" stroke-width="2" fill="none" opacity="0.5"/><path d="M1876 70V44H1850" stroke="#f1ede4" stroke-width="2" fill="none" opacity="0.5"/><path d="M44 1010V1036H70" stroke="#f1ede4" stroke-width="2" fill="none" opacity="0.5"/><path d="M1876 1010V1036H1850" stroke="#f1ede4" stroke-width="2" fill="none" opacity="0.5"/><text x="96" y="82" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="18" font-weight="500" fill="#f1ede4" letter-spacing="3" opacity="0.7">CASE FILE 01</text><text x="1824" y="82" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="18" font-weight="500" fill="#f1ede4" text-anchor="end" letter-spacing="3" opacity="0.7">STUDIO 90 · AI × FOOTBALL</text><rect x="1572" y="962" width="252" height="38" fill="#ff4d3d"/><text x="1810" y="988" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="17" font-weight="600" fill="#0e0f12" text-anchor="end">Sky Sports, Feb 2025</text>
