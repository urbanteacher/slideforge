<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><base href="/"><title>AI Awareness Day 2027 — Design review</title>
<link rel="stylesheet" href="css/app.css"><link rel="stylesheet" href="css/aiad27.css"><link rel="stylesheet" href="css/customize.css">
<style>
body{overflow:auto;background:#e8e5dc;color:#231f20;font-family:'AIAD Sans',Arial,sans-serif}main{max-width:1540px;margin:auto;padding:50px 36px 80px}.review-header{display:flex;justify-content:space-between;gap:24px;align-items:end;margin-bottom:30px}.review-header h1{font-size:clamp(36px,5vw,72px);line-height:1;letter-spacing:-.05em;margin:10px 0}.review-header p{font-size:19px;margin:0}.review-header a{color:inherit}nav{display:flex;gap:10px;flex-wrap:wrap;margin:30px 0 45px}nav a{border:1px solid #231f20;padding:10px 20px;border-radius:30px;text-decoration:none;color:inherit}section{scroll-margin-top:30px;margin-bottom:60px}section>h2{font-size:34px;border-bottom:2px solid;padding-bottom:14px}.review-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}.tile{display:block;border:0;padding:0;text-align:left;background:transparent;cursor:pointer;min-width:0}.thumb{display:block;width:100%;aspect-ratio:16/9;position:relative;overflow:hidden;background:#f6f4ed;box-shadow:0 3px 8px #231f2015}.tile:focus-visible{outline:4px solid #6745ca;outline-offset:5px}.caption{display:block;margin:10px 0;font-size:16px}.thumb .slide,.viewstage .slide{transform-origin:top left;pointer-events:none}.review-dialog{padding:0;border:0;background:#171516;color:#fff;width:100vw;height:100vh;max-width:none;max-height:none;margin:0}.review-dialog::backdrop{background:#171516}.viewbar{height:64px;display:flex;gap:14px;align-items:center;padding:12px 24px}.viewbar button{border:1px solid #777;background:none;border-radius:6px;color:white;padding:6px 14px;cursor:pointer}.viewbar #close{margin-left:auto}.viewstage{position:relative;width:min(100vw,calc((100vh - 84px)*16/9));aspect-ratio:16/9;margin:0 auto;overflow:hidden}.viewbar button:disabled{opacity:.3;cursor:default}@media(max-width:750px){main{padding:24px 16px}.review-header{display:block}.review-grid{grid-template-columns:1fr}.review-header p{margin-top:16px}}
</style></head><body><main>
<header class="review-header"><div><p>AI AWARENESS DAY / 2027</p><h1>Your AI. Your choices.</h1></div><p>Five starters. 35 slides.<br>Select a slide to view it full size.<br><a href="AiAd27/bundles/AiAd27-All-Five.sfbundle.json" download>Download the SlideForge bundle</a></p></header>
<nav aria-label="Choose a strand"></nav><div id="decks"></div><p id="error" role="alert"></p>
</main><dialog class="review-dialog" aria-label="Slide preview"><div class="viewbar"><button id="prev" aria-label="Previous slide">←</button><span id="position"></span><button id="next" aria-label="Next slide">→</button><span>Arrow keys to navigate</span><button id="close">Close ×</button></div><div class="viewstage"></div></dialog>
<script src="js/model.js"></script><script src="js/render.js"></script>
<script>
(async()=>{
 const response=await fetch('AiAd27/bundles/AiAd27-All-Five.sfbundle.json');if(!response.ok)throw new Error('Run node AiAd27/build.js to build the decks.');
 const {decks}=await response.json(), all=[],dialog=document.querySelector('dialog'),stage=document.querySelector('.viewstage');let current=0,trigger;
 const resize=new ResizeObserver(entries=>entries.forEach(({target})=>{let slide=target.querySelector('.slide');if(slide)slide.style.transform=`scale(${target.clientWidth/1280})`}));
 function render(target,d,s){target.replaceChildren(SF.renderSlide(d,s,{interactive:false,revealed:99}));target.firstChild.style.transform=`scale(${target.clientWidth/1280})`;resize.observe(target)}
 function view(i){current=i;const {d,s}=all[i];render(stage,d,s);document.querySelector('#position').textContent=`${d.theme.slice(7)} / ${i+1} of ${all.length}`;document.querySelector('#prev').disabled=i===0;document.querySelector('#next').disabled=i===all.length-1;if(document.activeElement.disabled)document.querySelector('#close').focus()}
 decks.forEach(d=>{const name=d.theme.slice(7),section=document.createElement('section');section.id=name;const title=document.createElement('h2');title.textContent=d.title;section.append(title);const link=document.createElement('a');link.href='#'+name;link.textContent=name[0].toUpperCase()+name.slice(1);document.querySelector('nav').append(link);const grid=document.createElement('div');grid.className='review-grid';section.append(grid);
 d.slides.filter(s=>!s.hidden).forEach((s,i)=>{const n=all.length;all.push({d,s});const tile=document.createElement('button');tile.className='tile';const thumb=document.createElement('span');thumb.className='thumb';thumb.setAttribute('aria-hidden','true');const caption=document.createElement('span');caption.className='caption';caption.textContent=`${String(i+1).padStart(2,'0')} — ${s.title||s.body}`;tile.append(thumb,caption);tile.onclick=()=>{trigger=tile;dialog.showModal();view(n);document.querySelector('#close').focus()};grid.append(tile);render(thumb,d,s)});document.querySelector('#decks').append(section)});
 document.querySelector('#close').onclick=()=>dialog.close();dialog.addEventListener('close',()=>trigger?.focus());document.querySelector('#prev').onclick=()=>view(Math.max(0,current-1));document.querySelector('#next').onclick=()=>view(Math.min(all.length-1,current+1));dialog.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){e.preventDefault();view(Math.min(all.length-1,current+1))}if(e.key==='ArrowLeft'){e.preventDefault();view(Math.max(0,current-1))}});
})().catch(e=>document.querySelector('#error').textContent=e.message);
</script></body></html>
