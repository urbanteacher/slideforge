<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A shared lesson — SlideForge</title>
<!-- The address share links were made with. Every shared lesson is now played by the studio viewer
     (lab-app/view.html, lab-engine-plan M12), which also tells a reader whose link was made by the classic
     slideshow (gone since M14) to ask for it again. -->
<style>
  html, body { margin: 0; height: 100%; background: #0c0d10; color: #e7eaf0; font: 16px/1.5 system-ui, sans-serif; }
  .share-msg { position: fixed; inset: 0; display: grid; place-content: center; gap: 10px; text-align: center; padding: 2rem; }
  .share-msg h1 { font-size: 1.3rem; margin: 0; }
  .share-msg p { margin: 0; opacity: .75; max-width: 30rem; }
</style>
<script>location.replace('lab-app/view.html' + location.search + location.hash);</script>
</head>
<body>
<div class="share-msg"><h1>Opening the lesson…</h1><p><a href="lab-app/view.html" id="go" style="color:inherit">Open it here</a> if nothing happens.</p></div>
<script>document.getElementById('go').href = 'lab-app/view.html' + location.search;</script>
</body>
</html>
