<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A shared lesson — SlideForge</title>
<!-- A shared deck, read only.

     This is the presentation runtime with the editor left out: the same
     model, the same renderer, the same player, so a shared copy looks
     exactly like the lesson rather than like an approximation of it. The
     scripts that author, store or host are simply not loaded, which is a
     firmer guarantee than hiding their buttons.

     Navigation only — no teaching HUD. A share is for reading the slides,
     not for hosting the room. -->
<link rel="stylesheet" href="css/app.css?v=37">
<link rel="stylesheet" href="css/board-common.css?v=1">
<link rel="stylesheet" href="css/memory.css?v=2">
<link rel="stylesheet" href="css/bingo.css?v=2">
<link rel="stylesheet" href="css/bowl.css?v=2">
<link rel="stylesheet" href="css/lowstakes.css?v=2">
<link rel="stylesheet" href="css/studio.css?v=11">
<link rel="stylesheet" href="css/northeastern.css?v=10">
<link rel="stylesheet" href="css/ukbt.css?v=16">
<link rel="stylesheet" href="css/variant-themes.css?v=5">
<link rel="stylesheet" href="css/customize.css?v=2">
<link rel="stylesheet" href="css/lesson-moments.css?v=2">
<link rel="stylesheet" href="css/game-polish.css?v=1">
<style>
  .share-shell { position: fixed; inset: 0; background: #0c0d10; }
  .share-msg { position: fixed; inset: 0; display: grid; place-content: center; gap: 10px;
    text-align: center; font: 16px/1.5 system-ui, sans-serif; color: #e7eaf0; padding: 2rem; }
  .share-msg h1 { font-size: 1.3rem; margin: 0; }
  .share-msg p { margin: 0; opacity: .75; max-width: 30rem; }
  .share-bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
    display: flex; gap: 14px; align-items: center; justify-content: center;
    padding: 7px 12px; font: 12px system-ui, sans-serif; color: #aab3c2;
    background: #00000066; backdrop-filter: blur(6px); }
  .share-bar b { color: #e7eaf0; font-weight: 600; }
  .share-bar { display: flex; gap: 18px; align-items: center; justify-content: space-between; }
  /* Keep the simple ‹ › bar easy to find; hide nothing else because the
     teaching tools are not in the markup for this page. */
  body.share-browse .hud {
    opacity: .55; pointer-events: auto; bottom: 36px;
  }
  body.share-browse .hud.show { opacity: 1; }
  body.share-browse .hud .hud-share-only { display: inline-flex; gap: 2px; align-items: center; }
</style>
</head>
<body class="ws-deck share-shell" data-ready>
<div id="player">
  <div class="deck-viewport"></div>
</div>
<!-- Browse-only HUD: prev / position / next. Click the slide or use arrows. -->
<div class="hud" id="hud" role="toolbar" aria-label="Browse slides">
  <button data-act="prev" title="Previous slide (←)" aria-label="Previous slide">‹</button>
  <span class="pos" aria-live="polite">1 / 1</span>
  <button data-act="next" title="Next slide (→ or space)" aria-label="Next slide">›</button>
  <span class="sep"></span>
  <button data-act="full" title="Full screen (F)" aria-label="Full screen">⛶</button>
</div>

<div id="toast"></div>
<div class="share-msg" id="shareMsg"><h1>Opening the lesson…</h1><p>Fetching a read-only copy.</p></div>

<script src="js/qr.js?v=2"></script>
<script src="js/model.js?v=25"></script>
<script src="js/playbook.js?v=2"></script>
<script src="js/ask.js?v=4"></script>
<script src="js/race.js?v=2"></script>
<script src="js/boss.js?v=2"></script>
<script src="js/lessons.js?v=27"></script>
<script src="js/customize.js?v=9"></script>
<script src="js/explore.js?v=1"></script>
<script src="js/render.js?v=39"></script>
<script src="js/memory.js?v=2"></script>
<script src="js/bingo.js?v=2"></script>
<script src="js/bowl.js?v=2"></script>
<script src="js/lowstakes.js?v=2"></script>
<script src="js/demo.js?v=2"></script>
<script src="js/player.js?v=9"></script>
<script src="js/live.js?v=10"></script>
<script src="js/ai.js?v=2"></script>
<script src="js/quick-poll.js?v=1"></script>
<script src="js/teaching.js?v=2"></script>
<script src="js/lesson-moments.js?v=2"></script>
<script src="js/print.js?v=2"></script>
<script>
(function () {
  'use strict';
  var SF = window.SF;
  var msg = document.getElementById('shareMsg');
  function fail(title, detail) {
    msg.innerHTML = '';
    var h = document.createElement('h1'); h.textContent = title;
    var p = document.createElement('p'); p.textContent = detail;
    msg.appendChild(h); msg.appendChild(p);
    msg.style.display = 'grid';
  }
  function esc(t) { return String(t).replace(/[<&>]/g, ''); }
  var params = new URLSearchParams(location.search);
  var id = params.get('s') || '';
  var follow = params.get('follow') === '1';
  if (!/^[a-f0-9]{32}$/.test(id)) {
    fail('That link is not complete', 'A shared lesson address ends in ?s= followed by the code from the link you were sent.');
    return;
  }
  fetch('/api/share/' + id, { cache: 'no-store' })
    .then(function (r) { return r.ok ? r.json() : r.json().then(function (e) { throw new Error(e.error || 'Not found'); }); })
    .then(function (data) {
      var deck = SF.normalizeDeck(data.doc);
      /* Games are not carried into a share: they are separate documents and
         the live room they belong to is not running. The slide that embedded
         one says so rather than failing. */
      var run = SF.buildRunDeck(deck, function () { return null; });
      msg.style.display = 'none';
      SF.Player.start(run, 0, { fullscreen: false, share: true });
      var bar = document.createElement('div');
      bar.className = 'share-bar';
      document.body.appendChild(bar);
      document.title = (deck.title || 'A shared lesson') + ' — SlideForge';

      /* ?follow=1 turns the same page from a copy you read at your own pace
         into a screen that follows the room. Same deck, same renderer; the
         only difference is who decides which slide is up.

         There is no PIN in this address. The 32-hex share id IS the
         credential, and the relay checks it in constant time against the id
         the host registered — so this link is a spectator seat and nothing
         else. A watcher is not a player: it is never counted in the room, has
         no name, answers nothing, and appears in no report. */
      if (!follow) {
        bar.innerHTML = '<span><b>' + esc(deck.title || 'Shared lesson') +
          '</b> · read only</span><span>Click the slide or use ← →</span>';
        return;
      }
      document.body.classList.add('share-follow');
      /* The player's own arrows are hidden rather than left to be clicked and
         ignored: a control that visibly does nothing is worse than no control.
         Full screen stays — it is the entire point of watching on a desktop. */
      var css = document.createElement('style');
      css.textContent = 'body.share-follow .hud .hud-share-only { display: none !important; }' +
        'body.share-follow .share-bar { gap: 18px; }';
      document.head.appendChild(css);
      var status = document.createElement('span');
      bar.appendChild(Object.assign(document.createElement('span'), {
        innerHTML: '<b>' + esc(deck.title || 'Live lesson') + '</b> · following the room'
      }));
      bar.appendChild(status);
      function say(t) { status.textContent = t; }
      say('Connecting…');

      /* Navigation off. A screen that can run ahead of the presenter is not
         following them, and somebody reading three slides early is worse than
         somebody reading none. Capture phase so it beats the player's own
         handlers rather than racing them. */
      ['keydown', 'click'].forEach(function (ev) {
        document.addEventListener(ev, function (e) {
          if (ev === 'keydown' && !/^(Arrow|Page| |Home|End|Enter)/.test(e.key)) return;
          e.stopPropagation();
          if (ev === 'keydown') e.preventDefault();
        }, true);
      });

      var at = null;
      function land(m) {
        if (!m || !m.n) return;
        at = m;
        var i = Math.max(0, Math.min(run.slides.length - 1, m.n - 1));
        var moved = i !== SF.Player.idx;
        if (moved) SF.Player.goTo(i, i > SF.Player.idx ? 1 : -1, true);
        /* Follow the build as well as the slide. Without this a Build-on-Next
           slide shows its heading and nothing else for as long as it is up —
           which the smoke test caught, and which would have been the first
           thing anybody noticed on a real deck. Stepping rather than jumping
           because that is the only way in, and it is idempotent once there. */
        var want = Math.max(0, Number(m.step) || 0);
        var guard = 0;
        while ((SF.Player.revealStep || 0) < want && guard++ < 40) SF.Player.next();
        say('Slide ' + m.n + (m.total ? ' of ' + m.total : ''));
      }

      var tries = 0, sock = null;
      (function connect() {
        var proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
        try { sock = new WebSocket(proto + '//' + location.host); }
        catch (e) { say('Could not connect.'); return; }
        sock.onopen = function () { tries = 0; sock.send(JSON.stringify({ t: 'watch', s: id })); };
        sock.onmessage = function (e) {
          var m; try { m = JSON.parse(e.data); } catch (x) { return; }
          if (m.t === 'watching') { say(m.at ? '' : 'Waiting for the presenter…'); land(m.at); }
          else if (m.t === 'context') land(m);
          else if (m.t === 'watchEnd') { say(m.message || 'The lesson has ended.'); sock.close(); sock = null; }
          else if (m.t === 'error') say(m.message || 'Not presenting right now.');
        };
        /* Reconnect, because a projector left on all morning will drop. Backs
           off to half a minute so a server that is down is not hammered. */
        sock.onclose = function () {
          if (!sock) return;
          sock = null;
          tries++;
          say('Reconnecting…');
          setTimeout(connect, Math.min(30000, 800 * Math.pow(2, Math.min(tries, 5))));
        };
      })();
    })
    .catch(function (e) {
      fail('This link no longer works', String(e.message || e) +
        ' Shared copies are held on the server, and a hosted server loses them when the app is updated.');
    });
})();
</script>
</body>
</html>
