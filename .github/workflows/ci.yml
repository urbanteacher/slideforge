# The suite existed long before this file did. 427 unit assertions, 45 smoke
# scripts and 597 visual baselines, all of which ran only when somebody
# remembered — which worked, right up until the first busy week. This is the
# trigger, not the tests.
name: CI

on:
  push:
    branches: ['**']
  pull_request:

# A second push to the same branch makes the first run pointless. Cancel it
# rather than queue behind it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Deterministic and fast: no browser, no server, no network. If this is red
  # nothing else is worth running, which is why it is a separate job.
  check:
    name: build, types and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The floor declared in package.json engines, not the newest release.
      # Testing what we promise to support is the point of declaring it.
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm

      - run: npm ci

      # build:check fails if js/model.js is out of date with src/, which is the
      # one place this repo can silently ship a stale artefact.
      - run: npm test

  # Renders real slides in a real browser and measures the result. Slower, and
  # depends on Chromium, so it is split off — a failure here is a different
  # kind of news from a type error.
  smoke:
    name: rendered-slide smokes
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm

      - run: npm ci

      # Chromium only. The smokes measure geometry produced by our own CSS, not
      # cross-browser behaviour, so Firefox and WebKit would triple the minutes
      # and tell us nothing we are currently asking.
      - run: npx playwright install --with-deps chromium

      # Curated rather than all 42, which take long enough that people start
      # skipping the branch. The set is named `ci` in tools/smoke/run.mjs, so
      # the same nineteen run here and on a laptop with `npm run smoke:ci`,
      # and the runner fails loudly if the set names a smoke that no longer
      # exists rather than quietly running eighteen of nineteen.
      #
      # Nine of them arrived here from `npm test`, where a wrapper test used
      # to spawn each one and match a line of its output. That put a browser
      # in the fast check and made a second index of which smokes matter; the
      # set is the index now. Same coverage, named in one place.
      #
      # What the set guards:
      #   fit-check            every library slide fits its frame
      #   demo-deck            the 97-slide layout bank, audit and budget
      #   layout-fit           the picker's predictions match real renders
      #   layout-face          the lattice: click, move, resize, anchor, reset
      #   artwork-face         posing a theme shape, and placing a picture
      #   canvas-edit          a click on the canvas edits the block it hit
      #   lesson-bank          the library files and clones
      #   handout              the print path, every image resolved
      #   review-tool          any deck reviewable and fit-checkable
      #   slide-review         aspect ratios, edge overflow, import isolation
      #   design-controls      every design control reachable and operable
      #   campaign-chrome      campaign furniture across five strands
      #   chrome-region(s)     declared insets, and region coverage
      #   clipboard-selection  highlighted text keeps the clipboard
      #   refresh              a reload comes back to the deck you were on
      #   exports / share      writing a deck out, and sending a copy
      #   live-quiz            the multi-client live path
      #
      # The last four were added after all four turned out to have been broken
      # for a day with nobody noticing: refresh by a real regression, the other
      # three by a path this suite's own move redirected. A curated set that
      # leaves out the things most likely to break quietly is a set that hides
      # them.
      # Measured locally at 110s in total, of which demo-deck is 39.
      - run: npm run smoke:ci

      - name: upload failure output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-failures
          path: |
            tools/baselines/diffs/
            *.log
          if-no-files-found: ignore
          retention-days: 7

  # 642 screenshots at 1280x720, compared to the pixel. Runs in the Playwright
  # container rather than on the bare runner so that what verifies a baseline is
  # the same environment that captured it — the baselines in tools/baselines are
  # Linux-rendered for exactly this reason, and were regenerated in this image
  # on 2026-09-18.
  visual:
    name: visual regression
    runs-on: ubuntu-latest
    needs: check
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@v4

      # A bare playwright image has no Palatino and no Helvetica and resolves
      # both to WenQuanYi Zen Hei, a CJK face — which renders the Northeastern
      # display serif as something nobody would recognise. urw-base35 supplies
      # P052, a Palatino clone, and Palatino is the second entry in the
      # --nu-display stack, so CI renders a face the CSS itself names.
      #
      # Same list as tools/visual-docker.mjs. If one changes, both change.
      - name: fonts the themes actually ask for
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            fonts-urw-base35 fonts-liberation fonts-crosextra-carlito fonts-crosextra-caladea
          fc-cache -f

      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm

      - run: npm ci

      # Measured at 78.6s in this image for all 642.
      - run: node tools/visual-regression.mjs --check

      # The diff PNGs are the whole point of a failure here — without them the
      # log says a percentage and nothing about what moved.
      - name: upload diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs
          path: tools/baselines/diffs/
          if-no-files-found: ignore
          retention-days: 7
