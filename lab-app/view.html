    <style>@font-face{font-family:Uncut Sans;src:url(/lab-app/fonts/uncut-sans/UncutSans-Regular.woff2)format("woff2");font-weight:300 500;font-display:swap}@font-face{font-family:Uncut Sans;src:url(/lab-app/fonts/uncut-sans/UncutSans-Semibold.woff2)format("woff2");font-weight:600;font-display:swap}@font-face{font-family:Uncut Sans;src:url(/lab-app/fonts/uncut-sans/UncutSans-Bold.woff2)format("woff2");font-weight:700 900;font-display:swap}@font-face{font-family:Alpha Lyrae;src:url(/lab-app/fonts/alpha-lyrae/AlphaLyrae-Medium.woff2)format("woff2");font-weight:400 600;font-display:swap}html,body{color:#e7eaf0;background:#0c0d10;height:100%;margin:0;font:14px/1.4 Inter,system-ui,sans-serif;overflow:hidden}#sf-stage{place-items:center;display:grid;position:fixed;inset:0 0 40px}#sf-canvas{touch-action:pan-y;display:block}#sf-msg{text-align:center;place-content:center;gap:10px;padding:2rem;display:grid;position:fixed;inset:0}#sf-msg[hidden]{display:none}#sf-msg h1{margin:0;font-size:1.3rem}#sf-msg p{opacity:.75;max-width:30rem;margin:0}#sf-bar{box-sizing:border-box;color:#aab3c2;background:#0006;justify-content:space-between;align-items:center;gap:16px;height:40px;padding:0 12px;font-size:12px;display:flex;position:fixed;bottom:0;left:0;right:0}#sf-bar b{color:#e7eaf0;font-weight:600}#sf-bar button{color:#e7eaf0;font:inherit;cursor:pointer;background:#ffffff14;border:0;border-radius:6px;padding:5px 10px}#sf-bar button:hover{background:#ffffff26}.sf-nav{align-items:center;gap:6px;display:inline-flex}.sf-pos{text-align:center;min-width:4.5em}#sf-list{background:#16181d;border-radius:10px;gap:2px;width:min(320px,100vw - 24px);max-height:70vh;padding:6px;display:grid;position:fixed;bottom:48px;right:12px;overflow:auto;box-shadow:0 10px 30px #0008}#sf-list[hidden]{display:none}#sf-list button{text-align:left;color:#e7eaf0;font:inherit;cursor:pointer;background:0 0;border:0;border-radius:6px;padding:7px 10px}#sf-list button:hover,#sf-list button.now{background:#ffffff1a}#sf-practice{box-sizing:border-box;background:#16181df2;border-radius:12px;width:min(640px,100vw - 24px);padding:12px 14px;position:fixed;bottom:52px;left:50%;transform:translate(-50%);box-shadow:0 10px 30px #0008}#sf-practice[hidden]{display:none}#sf-practice p{margin:0 0 8px}.sf-q{font-weight:600}.sf-options{grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:6px;margin-bottom:8px;display:grid}.sf-options button{text-align:left;color:#e7eaf0;font:inherit;cursor:pointer;background:#ffffff0d;border:1px solid #ffffff26;border-radius:8px;padding:9px 12px}.sf-options button.right{background:#1f7a4a;border-color:#2fae6b}.sf-options button.wrong{background:#7a2a1f;border-color:#c2533f}.sf-options button:disabled{cursor:default}.sf-room{opacity:.8}@media (width<=640px){.sf-hint,.sf-score{display:none}}</style>
