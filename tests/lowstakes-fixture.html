<!doctype html><html lang="en"><meta charset="utf-8"><title>Low-stakes quiz regression fixture</title>
<style>body{margin:0;font:14px system-ui}header{height:42px;display:flex;gap:10px;align-items:center;padding:0 12px;flex-wrap:wrap}iframe{border:0;width:100%;height:calc(100vh - 42px)}</style>
<header>Test fixture · paper retrieval
<button data-time="120">2 min</button><button data-time="180">3 min</button><button data-time="240">4 min</button>
<button id="gaps">With gaps</button>
<button id="theme">Switch theme</button><button id="presenter-test">Private presenter</button></header>
<iframe src="../index.html" title="SlideForge under test"></iframe>
<script>
/* Synthetic board: Start → Pause → Reveal early / let the clock expire → Replay.
   Gaps mode leaves incomplete rows on the worksheet so named gaps stay visible. */
var frame=document.querySelector('iframe'),theme='studio',seconds=180,withGaps=false;
var PAIRS=[
  ['What does RAM stand for?','Random Access Memory'],
  ['What is the function of the CPU?','To process instructions and perform calculations'],
  ['What type of storage is an SSD?','Solid State Drive / Flash storage'],
  ['What does ROM contain?','Read Only Memory / Boot instructions / BIOS'],
  ['What is cache memory used for?','Storing frequently accessed data for quick retrieval']
];
function play(){
  var SF=frame.contentWindow.SF,g=SF.makeGame('Hardware retrieval','lowstakes');
  g.theme=theme;g.settings.intro=false;g.settings.defaultTime=seconds;
  g.questions=PAIRS.map(function(p,i){
    var q=SF.normalizeQuestion(Object.assign(SF.makeQuestion('lowstakes'),
      {question:p[0],answer:p[1]}),'lowstakes');
    if(withGaps&&i===1)q.question='';
    if(withGaps&&i===3)q.answer='';
    return q;
  });
  var deck=SF.gameToRunDeck(g);
  deck.slides.push(Object.assign(SF.makeSlide('title'),{title:'Continue your lesson'}));
  SF.Player.start(deck,0,{fullscreen:false});
}
document.querySelectorAll('[data-time]').forEach(function(b){b.onclick=function(){seconds=Number(b.dataset.time);play();};});
document.querySelector('#gaps').onclick=function(){withGaps=!withGaps;play();};
document.querySelector('#theme').onclick=function(){theme=theme==='studio'?'midnight':'studio';play();};
document.querySelector('#presenter-test').onclick=function(){
 var stale=document.querySelector('iframe[title="Private presenter"]');if(stale)stale.remove();
 var privateFrame=document.createElement('iframe');privateFrame.title='Private presenter';privateFrame.src='../presenter.html';
 privateFrame.style.cssText='position:fixed;inset:42px 0 0;width:100%;height:calc(100vh - 42px);background:white;z-index:10';document.body.appendChild(privateFrame);
 privateFrame.onload=function(){var host=frame.contentWindow,original=host.open;privateFrame.contentWindow.opener=host;host.open=function(){return privateFrame.contentWindow;};host.SF.Player.openPresenter();host.open=original;host.SF.Player.syncPresenter();};
};
</script></html>
